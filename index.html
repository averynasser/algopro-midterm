{"q":"Base case untuk fact dengan definisi faktorial slide adalah ...","answer":"fact(0) = 1","level":"Sedang","type":"Pilihan ganda","why":"0! bernilai 1 dan langsung kembali. Nilai 0 akan meniadakan seluruh perkalian. n + 1 menjauh dari nol pada domain positif.","options":["fact(0) = 1","fact(0) = 0","fact(n) = fact(n + 1)"]},{"q":"Hitung fact(4) dengan base case fact(0) = 1.","answer":"24","level":"Sulit","type":"Isian singkat","why":"fact(4) = 4 × 3 × 2 × 1 × fact(0) = 24. Nilai dikembalikan dari panggilan terdalam ke pemanggilnya.","steps":"fact(4) = 4 × 3 × 2 × 1 × fact(0) = 24. Nilai dikembalikan dari panggilan terdalam ke pemanggilnya."},{"q":"Dengan fib(0) = 0 dan fib(1) = 1, berapa fib(5)?","answer":"5","level":"Sulit","type":"Isian singkat","why":"fib(2) = 1, fib(3) = 2, fib(4) = 3, maka fib(5) = 3 + 2 = 5.","steps":"fib(2) = 1, fib(3) = 2, fib(4) = 3, maka fib(5) = 3 + 2 = 5."},{"q":"Pada maximum(score, limit), apa sebutan score dan limit pada pemanggilan?","answer":"Argument aktual","level":"Sedang","type":"Pilihan ganda","why":"Argument aktual adalah ekspresi yang dikirim saat pemanggilan. Parameter formal tercantum pada definisi, sedangkan base case menghentikan rekursi.","options":["Argument aktual","Parameter formal pada definisi","Base case"]}]}};

'switch':[['Start','Input pilihan','Nilai case?','Case cocok','Default','Stop'],[[0,1],[1,2],[2,3,'Cocok'],[2,4,'Lainnya'],[3,5,'break'],[4,5]]],
'for':[['Start','Inisialisasi','Kondisi?','Isi loop','Update','Stop'],[[0,1],[1,2],[2,3,'Ya'],[3,4],[4,2,'Ulang','back'],[2,5,'Tidak','side']]],

function chart(n,k){let [labels,edges]=flowModels[k];let fork=k==='if-else'||k==='switch',split=labels.findIndex(l=>l.includes('?'));let pts=labels.map((l,i)=>{let x=170,y=32+75*i;if(fork&&i===split+1)x=76;if(fork&&i===split+2){x=264;y-=75}if(fork&&i>split+2)y-=75;return {x,y,l}});let id='arrow'+n;let paths=edges.map(([a,b,l,mode])=>{let p=pts[a],q=pts[b],d,tx,ty;if(mode==='back'||mode==='side'){let right=mode==='side',x=right?304:30,delta=right?1:-1;d=`M${p.x+64*delta} ${p.y} H${x} V${q.y} H${q.x+65*delta}`;tx=x+(right?-18:17);ty=(p.y+q.y)/2}else{let mid=(p.y+q.y)/2;d=`M${p.x} ${p.y+22} V${mid} H${q.x} V${q.y-23}`;tx=p.x===q.x?p.x+25:(p.x+q.x)/2;ty=mid-3}return `<path d="${d}" fill="none" stroke="currentColor" marker-end="url(#${id})"/>${l?`<text x="${tx}" y="${ty}" text-anchor="middle" fill="var(--muted)" font-size="11">${l}</text>`:''}`}).join('');let nodes=pts.map(({x,y,l})=>{let shape=l.includes('?')?`<polygon points="${x},${y-22} ${x+65},${y} ${x},${y+22} ${x-65},${y}"/>`:l.includes('Input')?`<polygon points="${x-53},${y-20} ${x+64},${y-20} ${x+53},${y+20} ${x-64},${y+20}"/>`:`<rect x="${x-64}" y="${y-20}" width="128" height="40" rx="${['Start','Stop'].includes(l)?20:3}"/>`;return `<g stroke="currentColor" fill="var(--card)">${shape}</g><text x="${x}" y="${y+4}" text-anchor="middle" font-size="13" fill="var(--text)">${l}</text>`}).join('');return `<svg role="img" aria-label="Flowchart ${k}" viewBox="0 0 340 ${pts.at(-1).y+32}" style="display:block;max-width:370px;width:100%;margin:18px auto;color:var(--accent)"><defs><marker id="${id}" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="currentColor"/></marker></defs>${paths}${nodes}</svg>`}

function grade(value){let z=s.quiz;if(!z||z.response||z.finished||!String(value).trim())return;if(z.until&&Date.now()>=z.until){snapshotQuiz();render();return}let id=z.queue[z.pos],q=bank[id];let ok=q.options?value===q.answer:normalizeAnswer(value)===normalizeAnswer(q.answer);z.response={a:String(value),ok};z.log.push({id,ok});let a=s.attempt[q.n]||(s.attempt[q.n]={total:0,right:0});a.total++;if(!s.days.includes(day()))s.days.push(day());if(ok){a.right++;s.combo++;s.best=Math.max(s.best,s.combo);s.won[id]=true;s.xp+=10+(q.level==='Sulit'?5:0)+(s.combo>=3?3:0);s.wrong=s.wrong.filter(k=>k!==id)}else{s.combo=0;if(!s.wrong.includes(id))s.wrong.push(id);if(['review','module','panicReview'].includes(z.mode)&&!z.queue.slice(z.pos+1).includes(id)&&z.queue.filter(k=>k===id).length<2)z.queue.splice(Math.min(z.queue.length,z.pos+4),0,id)}save();render()}
function nextQ(){let z=s.quiz;if(!z.response)return;if(z.pos+1>=z.queue.length)snapshotQuiz();else{z.pos++;z.order=null;z.response=null}save();render();window.scrollTo(0,0)}
let flashN=null,flashList=[],flashPos=0,flipped=false,knownCount=0;
function openFlash(n){flashN=n;let all=DATA[n].cards.map((_,i)=>n+'-'+i);flashList=shuffle(all).sort((a,b)=>(s.card[a]||0)-(s.card[b]||0));flashPos=knownCount=0;flipped=false;go('flash')}
function flashMark(yes){let key=flashList[flashPos];s.card[key]=yes?1:-1;if(yes)knownCount++;save();flashPos++;flipped=false;render()}
function flashPage(){if(!flashN)return header('WORKSPACE / KARTU INGATAN','Flashcards','Balik kartu untuk melihat jawabannya. Kartu bertanda Belum muncul lebih awal saat deck dibuka lagi.')+`<div class="grid">${ids.map(n=>ex(meta[n][0],DATA[n].cards.length+' kartu',`openFlash(${n})`)).join('')}</div>`;let d=DATA[flashN];let top=header('FLASHCARDS / M'+flashN,meta[flashN][0]);if(flashPos>=flashList.length)return top+`<div class="box"><h2>Deck selesai</h2><p>${knownCount} hafal dari ${flashList.length} kartu.</p>${btn('Ulangi deck',`openFlash(${flashN})`)} ${btn('Pilih deck','flashN=null;render()')}</div>`;let i=Number(flashList[flashPos].split('-')[1]),c=d.cards[i];return top+`<div class="box"><div class="spread"><small>KARTU ${flashPos+1} / ${flashList.length}</small>${btn('Pilih deck','flashN=null;render()')}</div><button class="flash" onclick="flipped=!flipped;render()"><small>${flipped?'BELAKANG':'DEPAN · KETUK UNTUK MEMBALIK'}</small><p>${E(c[flipped?1:0])}</p></button>${flipped?btn('Belum','flashMark(false)')+' '+btn('Hafal ✓','flashMark(true)','primary'):''}</div>`}
function profile(){return header('PLAYER / STATISTIK',level(),`${s.xp} XP · ${streak()} hari berturut-turut`)+`<div class="box"><h2>Badge</h2><p class="${s.best>=10?'accent':'muted'}">${s.best>=10?'★':'☆'} Zero Warning · 10 jawaban benar berturut-turut (${s.best}/10)</p><p class="${ids.includes(7)&&ratio(7)===100?'accent':'muted'}">${ids.includes(7)&&ratio(7)===100?'★':'☆'} Pointer Slayer · Tuntaskan kuis M7</p></div><div class="box"><h2>Akurasi per modul</h2>${ids.map(n=>`<div class="sheet"><b>M${n} · ${meta[n][0]}</b><span>${accuracy(n)===null?'Belum berlatih':accuracy(n)+'%'} · ${s.attempt[n]?.total||0} jawaban</span></div>`).join('')}</div><p class="muted">${storageOK?'Progres tersimpan di browser ini.':'Penyimpanan browser tidak tersedia. Progres aktif selama halaman terbuka.'}</p>${btn('Reset progres','resetData()')}`}
function resetData(){if(!confirm('Hapus semua progres C-Quest tahap ini di browser ini?'))return;s=fresh();flashN=null;save();go('home')}
function startPanic(){if(!s.panic){s.panic={start:Date.now(),phase:0,started:false};save()}go('panic')}
function panicPhase(){if(!s.panic)return;let age=Date.now()-s.panic.start,p=age>=1800000?3:age>=1200000?2:age>=300000?1:0;if(p!==s.panic.phase){s.panic.phase=p;s.panic.started=false;if(s.quiz?.mode.startsWith('panic'))s.quiz=null;save();if(!['panic','quiz'].includes(route()))return;location.hash='panic';render()}}
function panicPage(){if(!s.panic)return header('MODE PANIK','Sesi terpandu')+btn('Mulai 30 menit','startPanic()','primary');let p=s.panic.phase;if(p===3)return header('MODE PANIK / SELESAI','30 menit selesai','Jawaban dan kesalahanmu tersimpan di profil.')+btn('Ke dashboard',"s.panic=null;save();go('home')",'primary');let content='';if(p===0)content=ids.map(n=>`<details class="box" ${n===1?'open':''}><summary><b>M${n} · ${meta[n][0]}</b></summary>${sheet(n)}</details>`).join('');else if(!s.panic.started){s.panic.started=true;save();let list=p===1?shuffle(['2-4','3-2','3-4','3-8','4-1','4-3','4-10','5-2','5-4','5-6','6-4','6-6','7-2','7-7','7-12']):shuffle(s.wrong);if(list.length){newQuiz(p===1?'panicQuiz':'panicReview',list);return ''}}else if(s.quiz&&!s.quiz.finished)content=btn('Lanjutkan soal',"go('quiz')",'primary');if(p>0&&!content)content='<div class="box">Latihan fase ini selesai. Kamu bisa lanjut lebih awal atau menunggu timer.</div>';return header('MODE PANIK / FASE '+(p+1),['Baca cheat sheet','15 soal jebakan','Review kesalahan'][p],['5 menit · buka modul yang ingin diingat kembali.','15 menit · fokus pada detail kode.','10 menit · coba lagi jawaban yang terlewat.'][p])+`<div class="actions">${btn(p===2?'Selesaikan':'Fase berikutnya →','advancePanic()')}${btn('Keluar',`go('home')`)}</div>`+content}
function advancePanic(){let p=s.panic.phase;s.panic.start=Date.now()-[300000,1200000,1800000][p];panicPhase()}
function clockTick(){let label='',remain=0;if(s.panic){panicPhase();if(s.panic&&s.panic.phase<3){label='Panik '+(s.panic.phase+1)+'/3';remain=s.panic.start+[300000,1200000,1800000][s.panic.phase]-Date.now()}}else if(s.quiz?.mode==='exam'&&!s.quiz.finished){remain=s.quiz.until-Date.now();label='Ujian';if(remain<=0){snapshotQuiz();if(route()==='quiz')render();label=''}}let t=Math.max(0,Math.ceil(remain/1000));document.getElementById('clock').textContent=label?label+' · '+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'):''}
function reviewPage(){return header('M08 / MATERIAL REVIEW I','Latihan Review UTS','Tulis percobaanmu dulu. Setelah itu, buka kunci dan bandingkan langkahnya.')+reviewItems.map((v,i)=>`<details class="box"><summary><b>Soal ${String(i+1).padStart(2,'0')}</b> · ${E(v.q)}</summary><label for="d${i}">Jawaban saya</label><textarea id="d${i}" oninput="s.draft[${i}]=this.value;save();document.getElementById('k${i}').disabled=!this.value.trim()">${E(s.draft[i]||'')}</textarea><button id="k${i}" ${s.draft[i]?.trim()?'':'disabled'} onclick="document.getElementById('a${i}').hidden=false">Tampilkan pembahasan</button><div id="a${i}" hidden><p style="white-space:pre-line">${E(v.solution)}</p>${v.code?`<pre>${hl(v.code)}</pre>`:''}${v.svg?`<div class="reviewSvg">${v.svg}</div>`:''}${(v.traces||[]).map(t=>`<pre>${E(t)}</pre>`).join('')}${v.why?`<p>${E(v.why)}</p>`:''}</div></details>`).join('')}
let searchTerm='';
function searchResults(){let k=norm(searchTerm);let out=document.getElementById('hits');if(!out)return;if(!k){out.innerHTML='<p class="muted">Coba “casting”, “break”, atau “pointer”.</p>';return}let hits=[];for(let n of ids){let d=DATA[n];let texts=[meta[n][0],...d.core,...d.sheet.map(x=>x.join(' · ')),...d.traps,...d.cards.map(x=>x.join(' · ')),...d.quiz.map(x=>[x.q,x.code,x.why].filter(Boolean).join(' '))];if(n===8)texts.push(...reviewItems.map(x=>x.q+' '+x.solution));let hit=texts.find(t=>norm(t).includes(k));if(hit)hits.push(ex('M'+n+' · '+meta[n][0],E(hit.slice(0,200)),`go('m${n}')`))}out.innerHTML=hits.join('')||'<p>Tidak ada konsep yang cocok. Coba istilah lain.</p>'}
function render(){document.body.classList.toggle('light',s.theme==='light');let path=route(),n=/^m(\d)$/.exec(path)?.[1];let active=n?'modules':['quiz','review8','empty','panic'].includes(path)?'practice':path;let visibleNav=navs.filter(v=>STAGE===4||v[0]!=='flash');document.getElementById('nav').innerHTML=visibleNav.map(([k,t,i])=>btn(icon(i)+t,`go('${k}')`,active===k?'on':'')).join('');document.getElementById('player').innerHTML=`<small>PLAYER_01</small><b>${level()}</b><small>${s.xp} XP</small>`;document.getElementById('crumb').textContent=n?'modul / M0'+n:({home:'dashboard',modules:'modul',quiz:'kuis',flash:'flashcards',profile:'profil',practice:'latihan',panic:'mode panik',search:'pencarian',review8:'review I'}[path]||path);let html;
if(n&&DATA[n])html=modulePage(+n);else switch(path){case 'modules':html=header('WORKSPACE / KURIKULUM','Semua modul','Pilih topik sesuai kebutuhan belajarmu.')+`<div class="grid">${ids.map(card).join('')}</div>`;break;case 'labs':html=header('WORKSPACE / SIMULASI','Laboratorium','Pilih skenario, lalu ubah input atau telusuri setiap langkah.')+[1,3,4,5,6,7].map(v=>'<details class="box"><summary><b>'+meta[v][0]+'</b></summary>'+visualizer(v)+flowLab(v)+'</details>').join('');break;case 'practice':html=practice();break;case 'quiz':html=quizPage();break;case 'empty':html=header('REVIEW KESALAHAN','Antrean kosong','Soal yang kamu jawab salah akan muncul di sini.')+btn('Ke latihan',"go('practice')");break;case 'flash':html=flashPage();break;case 'profile':html=profile();break;case 'review8':html=ids.includes(8)?reviewPage():practice();break;case 'panic':html=panicPage();if(route()!=='panic')return;break;case 'search':html=header('WORKSPACE / PENCARIAN','Cari konsep','Telusuri materi, kuis, dan flashcards.')+`<input type="search" id="query" placeholder="Cari keyword atau konsep…" aria-label="Cari konsep" value="${E(searchTerm)}" style="width:100%;margin-bottom:16px" oninput="searchTerm=this.value;searchResults()"><div class="grid" id="hits"></div>`;break;default:html=home()}
main.innerHTML=html;if(path==='search'){searchResults();document.getElementById('query').focus()}if(s.quiz&&!s.quiz.finished&&path==='practice')main.insertAdjacentHTML('afterbegin',btn('Lanjutkan sesi aktif →',"go('quiz')",'primary'))}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});setInterval(clockTick,500);render();</script></html>
