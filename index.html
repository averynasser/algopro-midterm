d)}nav button{border:1px solid transparent;background:transparent;color:var(--muted);width:100%;display:flex;align-items:center;gap:11px;text-align:left;margin:2px 0}.icon{width:19px;height:19px;display:inline-block;vertical-align:middle;flex:none}nav button.on{background:var(--dim);color:var(--accent);border-color:var(--line)}.player{margin-top:auto;border-top:1px solid var(--line);padding-top:15px}.player b{display:block}.wrap{margin-left:216px}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,3vw,52px)}.top .right,.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top .right{flex-wrap:nowrap}.top .searchbtn{font-size:13px;color:var(--muted)}main{max-width:1530px;padding:30px clamp(16px,3vw,52px) 60px;margin:auto}.labelbar,.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.labelbar{margin-bottom:14px}.tag{border:1px solid var(--line);padding:4px 8px;border-radius:6px;color:var(--muted)}.warm{color:var(--orange)}.hero{display:grid;grid-template-columns:1.35fr 1fr;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:252px}.herotxt{padding:clamp(22px,3vw,42px);position:relative;z-index:1}.hero h1{margin:12px 0}.hero p{color:var(--muted);margin-bottom:20px}.accent{color:var(--accent)}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.art{position:relative;display:grid;align-items:center;justify-items:center;background:radial-gradient(ellipse at center,#28493588,transparent 74%),linear-gradient(#91dc8110 1px,transparent 1px),linear-gradient(90deg,#91dc8110 1px,transparent 1px);background-size:auto,22px 22px,22px 22px;color:var(--accent)}.art svg{width:95%;max-height:235px}.art small{position:absolute;bottom:10px;right:13px;color:var(--accent)}.stats,.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0 30px}.stat,.box,.module,.exercise{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:14px 18px;display:flex;align-items:center;gap:12px}.stat strong{display:block;font-size:21px;line-height:1.25}.stat i,.ico{font-style:normal;color:var(--accent);border:1px solid var(--line);background:var(--dim);padding:8px;border-radius:9px;display:inline-grid;place-items:center}.sectiontitle{margin:28px 0 14px}.sectiontitle small{display:block}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.module{text-align:left;display:block;width:100%;padding:18px;position:relative;transition:transform .15s}.module:hover{transform:translateY(-2px)}.module h3{margin:14px 0 2px}.module .star{color:var(--orange);letter-spacing:2px}.bar{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px}.bar i{height:100%;display:block;background:var(--accent)}.box,.exercise{padding:clamp(16px,2vw,28px);margin:16px 0}.exercise{text-align:left;width:100%;margin:0}.subhead{margin:15px 0 22px}.subhead h1{margin:8px 0}.shadow{color:var(--muted)}.sheet{display:grid;grid-template-columns:minmax(110px,1fr) 2.4fr;border-top:1px solid var(--line);padding:10px 0;gap:14px}.sheet b{color:var(--cyan)}.trap{border-left:3px solid var(--orange);background:var(--card);padding:10px 14px;margin:8px 0}.box ul{padding-left:22px}.box li{margin:8px 0}.choice{display:block;text-align:left;width:100%;margin:9px 0}.good{border-color:var(--accent);color:var(--accent)}.bad{border-color:var(--orange);color:var(--orange)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;font-size:14px;line-height:1.65;tab-size:4}.kw{color:var(--cyan)}.str{color:var(--accent)}.num{color:var(--orange)}.comment{color:var(--muted)}textarea{display:block;width:100%;min-height:85px;margin:12px 0}.flash{width:100%;min-height:170px;margin:12px 0;font-size:22px}.reviewSvg{overflow:auto}.reviewSvg svg{max-width:100%;height:auto}#clock{position:fixed;bottom:14px;right:16px;border:1px solid var(--orange);background:var(--panel);padding:8px 14px;border-radius:12px;z-index:4;font:14px Consolas,monospace;color:var(--orange)}#clock:empty{display:none}.shake{animation:shake .22s}.spark{animation:spark .5s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes spark{50%{box-shadow:0 0 18px var(--accent)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}@media(max-width:1000px){#rail{width:182px}.wrap{margin-left:182px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat i{display:none}}@media(max-width:740px){#rail{inset:auto 0 0;width:100%;padding:4px;background:var(--panel);border-top:1px solid var(--line);border-right:0}#rail .brand,.navlabel,.player{display:none}nav{display:flex}nav button{display:flex;flex-direction:column;gap:1px;text-align:center;align-items:center;justify-content:center;padding:6px 1px;font-size:10px}.wrap{margin:0}.top{height:55px}.top .right button{padding:5px 9px}.top .searchbtn span{display:none}main{padding:18px 14px 85px}.hero{grid-template-columns:1fr}.art{min-height:100px;max-height:110px}.art svg{height:108px}.herotxt{padding:20px}.hero h1{font-size:36px}.stats{gap:6px;margin:10px 0 20px}.stat{padding:9px;align-items:start}.stat small{font-size:10px}.stat strong{font-size:16px}.grid{gap:9px}.module{padding:12px}.module h3{font-size:15px}.module small{font-size:10px}.tag{font-size:10px}.box{padding:14px}.top small{font-size:11px}#clock{bottom:64px}.sheet{grid-template-columns:1fr 1.65fr}.spread{gap:5px}}@media(max-width:430px){.exercise{padding:12px}.exercise h3{font-size:15px}.hero .actions{gap:6px}.actions button{font-size:13px}.module .ico{padding:5px}}
summary{cursor:pointer}summary:hover{color:var(--accent)}.sheet,.exercise,.trap,.box{overflow-wrap:anywhere}.spark{position:relative}.spark:before{content:'✦ · ✧';position:absolute;right:12px;top:7px;color:var(--accent);animation:rain .6s ease-out both}@keyframes rain{to{transform:translateY(-16px);opacity:0}}@media(prefers-reduced-motion:reduce){.spark:before{display:none}}</style><aside id="rail"><div class="brand"><b>›_</b><div>C-Quest<small>STUDY TERMINAL</small></div></div><div class="navlabel">WORKSPACE</div><nav id="nav"></nav><div class="player" id="player"></div></aside><div class="wrap"><header class="top"><small>workspace / <strong id="crumb">dashboard</strong></small><div class="right"><button class="searchbtn" onclick="go('search')" aria-label="Cari materi">⌕ <span>Cari konsep</span></button><button id="theme" onclick="toggleTheme()" aria-label="Ganti tema">☼</button></div></header><main id="main"></main></div><div id="clock"></div><script>const STAGE=4,DATA={"1":{"core":["Algoritma menyatakan langkah penyelesaian masalah dan urutan pelaksanaannya. Istilahnya berasal dari nama Al-Khowarizmi.","Mulai dengan mendefinisikan masalah dan model. Untuk akar persamaan kuadrat, modelnya memakai d = b² − 4ac.","Sesudah merancang algoritma, tulis kode, compile, jalankan, lalu dokumentasikan. Error sintaks muncul saat compile, sedangkan hasil yang salah dapat muncul saat run.","Pseudocode dan Structure English menyajikan langkah dengan tulisan. Flowchart menggambarkan aliran dengan simbol dan panah.","Enam operasi dasar ialah input, output, compute, store, compare, dan repetition.","Sequence menjalankan langkah berurutan. Selection memilih cabang dan repetition mengulang langkah selama kondisi terpenuhi.","Algoritma yang baik menghasilkan output yang benar, mempunyai langkah yang jelas, dapat diimplementasikan, dan berakhir."],"sheet":[["Input","Read, Get, atau Input mengambil data yang akan diproses."],["Output","Print, Write, atau Display menampilkan hasil."],["Compute","Hitung ekspresi, misalnya price × quantity."],["Store","Set total = 0 menyimpan nilai awal ke total."],["Compare","IF kondisi THEN ... ELSE ... ENDIF memilih blok sesuai hasil perbandingan."],["Repetition","DOWHILE kondisi ... ENDDO memeriksa kondisi sebelum menjalankan isi pada pseudocode slide."],["Diskriminan","Untuk a ≠ 0, d = b² − 4ac. Jika d < 0, contoh slide menampilkan Imaginary. Jika d ≥ 0, akar = (−b ± √d)/(2a)."],["Urutan pengembangan","Problem Definition → Model Development → Algorithm Design → Writing Code → Compile → Run → Documentation."]],"traps":["Urutan Read → Compute → Print berpengaruh. Perhitungan membutuhkan nilai input lebih dahulu.","Pseudocode DOWHILE di slide mengecek kondisi di awal. C do-while mengecek kondisi di akhir.","Program yang lolos compile masih dapat menghasilkan jawaban keliru."],"cards":[["Input","Read, Get, atau Input mengambil data yang akan diproses."],["Output","Print, Write, atau Display menampilkan hasil."],["Compute","Hitung ekspresi, misalnya price × quantity."],["Store","Set total = 0 menyimpan nilai awal ke total."],["Compare","IF kondisi THEN ... ELSE ... ENDIF memilih blok sesuai hasil perbandingan."],["Repetition","DOWHILE kondisi ... ENDDO memeriksa kondisi sebelum menjalankan isi pada pseudocode slide."],["Diskriminan","Untuk a ≠ 0, d = b² − 4ac. Jika d < 0, contoh slide menampilkan Imaginary. Jika d ≥ 0, akar = (−b ± √d)/(2a)."],["Urutan pengembangan","Problem Definition → Model Development → Algorithm Design → Writing Code → Compile → Run → Documentation."]],"quiz":[{"q":"Apa yang ditentukan pertama dalam pengembangan algoritma?","answer":"Masalah yang ingin diselesaikan","level":"Mudah","type":"Pilihan ganda","why":"Masalah menetapkan tujuan dan data yang dibutuhkan. Kode ditulis setelah desain. Dokumentasi akhir menyusul pengujian.","options":["Kode C","Masalah yang ingin diselesaikan","Dokumentasi akhir"]},{"q":"Representasi mana yang memakai simbol dan panah?","answer":"Flowchart","level":"Mudah","type":"Pilihan ganda","why":"Flowchart menggambar alur. Kedua pilihan lain menguraikan langkah dalam tulisan.","options":["Pseudocode","Structure English","Flowchart"]},{"q":"Operasi apa yang dilakukan oleh Read quantity?","answer":"Input","level":"Mudah","type":"Pilihan ganda","why":"Read mengambil masukan. Inisialisasi nol memerlukan Set atau Initialize, sedangkan output memakai Print.","options":["Input","Store nilai awal nol","Output"]},{"q":"Pilih instruksi untuk menampilkan hasil.","answer":"Display total","level":"Mudah","type":"Pilihan ganda","why":"Display mengeluarkan nilai. Read menerima masukan dan Initialize menulis nilai awal.","options":["Read total","Display total","Initialize total = 0"]},{"q":"Menghitung price × quantity terutama memakai operasi apa?","answer":"Compute","level":"Sedang","type":"Pilihan ganda","why":"Perkalian adalah perhitungan aritmetika. Tidak ada pengujian kondisi atau langkah yang diulang.","options":["Compare","Repetition","Compute"]},{"q":"Algoritma yang baik harus mempunyai langkah yang berakhir.","answer":"Benar","level":"Mudah","type":"Benar/salah","why":"Prosedur penyelesaian harus mencapai hasil setelah langkah yang jelas dan terbatas.","options":["Benar","Salah"]},{"q":"Memilih satu dari dua harga berdasarkan kondisi stok memakai struktur apa?","answer":"Selection","level":"Sedang","type":"Pilihan ganda","why":"Selection memilih cabang berdasarkan kondisi. Sequence saja selalu menjalankan urutan yang sama, sedangkan repetition mengulang.","options":["Sequence saja","Selection","Repetition"]},{"q":"Mencetak lima bintang dengan satu blok yang dipakai berkali-kali membutuhkan apa?","answer":"Repetition","level":"Sedang","type":"Pilihan ganda","why":"Repetition menjalankan blok cetak berulang kali. Selection memilih tindakan satu kali per pemeriksaan. Satu Print untuk satu bintang menghasilkan satu bintang.","options":["Selection saja","Satu Print tanpa pengulangan untuk satu bintang","Repetition"]},{"q":"Jika a = 1, b = 2, c = 1, berapa diskriminannya?","answer":"0","level":"Sedang","type":"Isian singkat","why":"b² = 4 dan 4ac = 4. Selisihnya 0, sehingga kedua akar berimpit.","steps":"b² = 4 dan 4ac = 4. Selisihnya 0, sehingga kedua akar berimpit."},{"q":"Jika a = 1, b = 0, c = 4, apa keluaran cabang diskriminan pada slide?","answer":"Imaginary","level":"Sedang","type":"Pilihan ganda","why":"d = 0 − 16 = −16, jadi d < 0. Akar real berbeda membutuhkan d > 0 dan akar kembar membutuhkan d = 0.","options":["Dua akar real berbeda","Imaginary","Dua akar real sama"]},{"q":"Program berhasil compile, tetapi total kasir salah karena harga ditambahkan ke quantity. Jenis error apa?","answer":"Logic error","level":"Sulit","type":"Pilihan ganda","why":"Kode dapat dijalankan, tetapi rumusnya salah. Syntax error menghalangi kompilasi. Mengubah dokumentasi tidak memperbaiki rumus.","options":["Syntax error","Kesalahan dokumentasi","Logic error"]},{"q":"Setelah model matematika tersedia, tahap apa yang langsung mengikutinya?","answer":"Algorithm Design","level":"Sedang","type":"Pilihan ganda","why":"Model diterjemahkan menjadi langkah algoritma sebelum menulis kode. Compile dan Run baru dapat dilakukan setelah kode tersedia.","options":["Algorithm Design","Compile","Run"]},{"q":"Pseudocode diawali stars = 0. Selama stars < 3, cetak satu bintang lalu naikkan stars satu. Berapa bintang tercetak?","answer":"3","level":"Sulit","type":"Isian singkat","why":"Saat stars = 0, 1, 2, kondisi benar dan satu bintang dicetak setiap kali. Saat stars = 3 kondisi salah.","steps":"Saat stars = 0, 1, 2, kondisi benar dan satu bintang dicetak setiap kali. Saat stars = 3 kondisi salah."}]},"2":{"core":["BCPL dibuat Martin Richards (1967), disusul B oleh Ken Thompson (1970), lalu C oleh Dennis Ritchie di Bell Labs (1972) pada DEC PDP-11. Buku K&R terbit 1978, standar awal disetujui 1989, dan C99 hadir kemudian.","C bersifat portable dan menyediakan standard library untuk kebutuhan seperti input/output dan matematika.","Program C terdiri atas function. Dalam lingkungan yang dipakai di kelas, eksekusi dimulai di main. Gunakan int main(void) dan return 0 untuk selesai normal.","Directive #include memasukkan deklarasi dari header. Directive ini ditulis pada baris tersendiri.","Comment /* ... */ dan // membantu pembaca. Escape sequence di dalam string mewakili karakter khusus.","Identifier membedakan huruf besar dan kecil. Karakter pertama harus huruf atau underscore, lalu dapat diikuti huruf, angka, atau underscore.","Keyword sudah dicadangkan dan tidak dapat dipakai sebagai nama variabel."],"sheet":[["Header","stdio.h untuk printf dan scanf, math.h untuk sqrt, string.h untuk operasi string, stdlib.h untuk utilitas umum, time.h untuk waktu."],["Identifier","name, x1, dan _total memenuhi pola penamaan. Hindari nama awal underscore yang dicadangkan di konteks tertentu. 1time dan int tidak sah sebagai nama variabel."],["Huruf besar/kecil","number dan Number adalah dua identifier berbeda."],["Comment","// berlaku sampai akhir baris (C99 dan sesudahnya). /* ... */ dapat melintasi baris."],["Escape untuk tata letak","\\n baris baru, \\t tab horizontal, \\v tab vertikal, \\r kembali ke awal baris, \\b mundur satu posisi, \\a alert."],["Escape untuk simbol","\\' untuk petik tunggal, \\\" untuk petik ganda dan \\\\ untuk backslash. \\x41 memakai nilai heksadesimal dan \\101 memakai oktal."],["Keyword C klasik (32)","auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while."],["Tambahan C99 yang dibahas","_Bool, _Complex, _Imaginary, inline, restrict."],["Akhir statement","Deklarasi dan expression statement biasanya berakhir dengan titik koma. Blok { ... } dan directive #include tidak memerlukan titik koma penutup."]],"traps":["Versi slide dosen: contoh lama memakai void main atau menghilangkan tipe. Untuk C modern di kelas, tulis int main(void) dan tipe setiap variabel/function secara eksplisit.","Comment tidak tercetak. Teks yang terlihat seperti comment di dalam string tetap dicetak sebagai karakter.","Spasi memisahkan token. Nama dua kata dengan spasi bukan satu identifier."],"cards":[["Header","stdio.h untuk printf dan scanf, math.h untuk sqrt, string.h untuk operasi string, stdlib.h untuk utilitas umum, time.h untuk waktu."],["Identifier","name, x1, dan _total memenuhi pola penamaan. Hindari nama awal underscore yang dicadangkan di konteks tertentu. 1time dan int tidak sah sebagai nama variabel."],["Huruf besar/kecil","number dan Number adalah dua identifier berbeda."],["Comment","// berlaku sampai akhir baris (C99 dan sesudahnya). /* ... */ dapat melintasi baris."],["Escape untuk tata letak","\\n baris baru, \\t tab horizontal, \\v tab vertikal, \\r kembali ke awal baris, \\b mundur satu posisi, \\a alert."],["Escape untuk simbol","\\' untuk petik tunggal, \\\" untuk petik ganda dan \\\\ untuk backslash. \\x41 memakai nilai heksadesimal dan \\101 memakai oktal."],["Keyword C klasik (32)","auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while."],["Tambahan C99 yang dibahas","_Bool, _Complex, _Imaginary, inline, restrict."],["Akhir statement","Deklarasi dan expression statement biasanya berakhir dengan titik koma. Blok { ... } dan directive #include tidak memerlukan titik koma penutup."],["Escape \\a","Alert atau bunyi peringatan, bergantung pada terminal."],["Escape \\b","Backspace, mundur satu posisi."],["Escape \\t dan \\v","Tab horizontal dan tab vertikal."],["Escape \\n dan \\r","Baris baru dan kembali ke awal baris."],["Escape \\' dan \\\"","Petik tunggal dan petik ganda."],["Escape \\\\","Satu karakter backslash."],["Escape \\x41 dan \\101","Nilai karakter 65, dalam heksadesimal dan oktal."],["Keyword · auto","Storage class untuk objek lokal otomatis."],["Keyword · break","Keluar dari switch atau loop terdekat."],["Keyword · case","Menandai nilai konstan pada switch."],["Keyword · char","Tipe karakter."],["Keyword · const","Membatasi perubahan lewat nama bertipe const."],["Keyword · continue","Menuju iterasi berikutnya dari loop terdekat."],["Keyword · default","Label cadangan switch bila tidak ada case yang cocok."],["Keyword · do","Memulai loop yang menguji kondisi sesudah menjalankan isi."],["Keyword · double","Tipe floating-point presisi ganda."],["Keyword · else","Cabang alternatif ketika kondisi if salah."],["Keyword · enum","Mendefinisikan tipe enumerasi dengan konstanta bernama."],["Keyword · extern","Mendeklarasikan nama yang dapat merujuk objek atau function yang didefinisikan di tempat lain."],["Keyword · float","Tipe floating-point presisi tunggal."],["Keyword · for","Loop dengan bagian inisialisasi, kondisi, dan update."],["Keyword · goto","Berpindah ke label di dalam function yang sama."],["Keyword · if","Memilih statement berdasarkan kondisi."],["Keyword · int","Tipe integer."],["Keyword · long","Specifier untuk tipe integer long atau floating long double."],["Keyword · register","Storage class yang mengisyaratkan penggunaan objek secara intensif."],["Keyword · return","Mengakhiri pemanggilan function, dengan nilai jika tipenya memerlukannya."],["Keyword · short","Modifier integer untuk short int."],["Keyword · signed","Menandai tipe integer bertanda."],["Keyword · sizeof","Operator yang menghasilkan ukuran dalam byte."],["Keyword · static","Pada variabel lokal, mempertahankan penyimpanan antarpemanggilan."],["Keyword · struct","Mendefinisikan struktur berisi anggota bernama."],["Keyword · switch","Memilih jalur berdasarkan nilai integer."],["Keyword · typedef","Memberi nama alternatif untuk suatu tipe."],["Keyword · union","Mendefinisikan anggota yang berbagi penyimpanan."],["Keyword · unsigned","Menandai tipe integer tanpa bilangan negatif."],["Keyword · void","Menunjukkan ketiadaan nilai return, misalnya pada void tampil(void)."],["Keyword · volatile","Qualifier untuk objek yang nilainya dapat berubah di luar alur biasa program."],["Keyword · while","Loop yang memeriksa kondisi sebelum isi."]],"quiz":[{"q":"Siapa yang mengembangkan C di Bell Labs?","answer":"Dennis Ritchie","level":"Mudah","type":"Pilihan ganda","why":"Dennis Ritchie membuat C. Ken Thompson mengembangkan B dan Martin Richards membuat BCPL.","options":["Ken Thompson","Martin Richards","Dennis Ritchie"]},{"q":"Header mana yang menyediakan deklarasi printf?","answer":"stdio.h","level":"Mudah","type":"Pilihan ganda","why":"printf adalah operasi output. math.h menyediakan fungsi matematika dan time.h menangani waktu.","options":["stdio.h","math.h","time.h"]},{"q":"Di function mana eksekusi program C kelas ini dimulai?","answer":"main","level":"Mudah","type":"Pilihan ganda","why":"Program masuk ke main. printf dan sqrt berjalan saat dipanggil.","options":["printf","main","sqrt"]},{"q":"Yang tidak sah sebagai identifier variabel lokal adalah ...","answer":"1time","level":"Mudah","type":"Perbaiki error","why":"Digit tidak boleh di awal. Pada x1, digit muncul setelah huruf. name hanya memakai huruf.","options":["x1","name","1time"]},{"q":"number dan Number merujuk ke variabel yang sama karena ejaannya mirip.","answer":"Salah","level":"Sedang","type":"Benar/salah","why":"C membedakan huruf besar dan kecil sehingga N mengubah identitas nama.","options":["Salah","Benar"]},{"q":"Mengapa int tidak boleh menjadi nama variabel?","answer":"int adalah keyword","level":"Sedang","type":"Pilihan ganda","why":"int dicadangkan sebagai penanda tipe. Nama dapat singkat dan tidak wajib memuat angka.","options":["Nama wajib diakhiri angka","int adalah keyword","Nama harus lebih dari 3 karakter"]},{"q":"Apa output program ini?","answer":"AC","level":"Sedang","type":"Tebak output","why":"printf pertama mencetak A. Statement untuk B berada di dalam comment. printf terakhir mencetak C.","options":["ABC","BC","AC"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"A\");\n    /* printf(\"B\"); */\n    printf(\"C\");\n    return 0;\n}","steps":"printf pertama mencetak A. Statement untuk B berada di dalam comment. printf terakhir mencetak C."},{"q":"Escape mana yang memindahkan output ke baris berikutnya?","answer":"\\n","level":"Sedang","type":"Pilihan ganda","why":"\\n memulai baris berikutnya. \\t berpindah ke tab horizontal dan \\r kembali ke awal baris saat ini.","options":["\\n","\\t","\\r"]},{"q":"Apa yang tercetak?","answer":"/* X */","level":"Sulit","type":"Tebak output","why":"Semua karakter di antara tanda kutip merupakan isi string. Tanda /* di posisi itu tidak memulai comment.","options":["X","/* X */","Tidak ada output"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"/* X */\");\n    return 0;\n}","steps":"Semua karakter di antara tanda kutip merupakan isi string. Tanda /* di posisi itu tidak memulai comment."},{"q":"Bagaimana menuliskan satu backslash dalam string literal?","answer":"\\\\","level":"Sedang","type":"Pilihan ganda","why":"\\\\ menghasilkan satu backslash. \\n dan \\t mewakili karakter kontrol.","options":["\\n","\\t","\\\\"]},{"q":"Pilih bentuk main untuk program C modern di kelas.","answer":"int main(void)","level":"Sedang","type":"Perbaiki error","why":"int adalah tipe return yang dipakai oleh bentuk standar ini. void main berbeda dan tipe implisit tidak digunakan di C modern.","options":["int main(void)","void main(void)","main(void) tanpa tipe"]},{"q":"Apa arti return 0 di akhir main?","answer":"Program berakhir dengan status sukses","level":"Sedang","type":"Pilihan ganda","why":"return menyerahkan status keluar. Output membutuhkan fungsi seperti printf dan return tidak memanggil main lagi.","options":["Angka 0 dicetak","Program berakhir dengan status sukses","main dipanggil ulang"]},{"q":"Mana keyword tambahan C99 yang dibahas di slide?","answer":"restrict","level":"Sulit","type":"Pilihan ganda","why":"restrict termasuk tambahan C99. switch sudah ada di daftar klasik. include adalah bagian dari directive preprocessor.","options":["switch","include","restrict"]}]},"3":{"core":["Setiap variabel memiliki nama, tipe, ukuran, tempat penyimpanan, dan nilai. Alamatnya dapat diambil dengan &.","Lima tipe dasar yang dibahas adalah char, int, float, double, dan void. Modifier yang dipelajari meliputi signed, unsigned, short, dan long.","sizeof memberi ukuran dalam byte pada implementasi yang dipakai. Besar int tidak selalu empat byte.","Cast (int)f membuang bagian pecahan jika nilai masih dapat direpresentasikan. Dua operand integer pada 7 / 2 menghasilkan 3 sebelum assignment.","Literal 3.14 bertipe double, 3.14f bertipe float, dan 3.14L bertipe long double.","#define memberi nama untuk substitusi, sedangkan const membentuk objek yang tidak boleh dimodifikasi melalui nama itu.","printf menampilkan nilai sesuai format. scanf membutuhkan alamat objek tujuan dan format yang cocok dengan tipenya."],"sheet":[["Deklarasi","int score = 75; menyimpan 75 di objek score. &score adalah alamatnya. Ekspresi score dapat menunjuk objek dan nilainya dapat dibaca."],["Versi slide dosen · char dan unsigned char","Dengan byte 8 bit dan char bertanda: 1 byte, −128..127. unsigned char: 1 byte, 0..255. Signedness plain char bergantung implementasi."],["Versi slide dosen · short","short: 2 byte, −32768..32767. unsigned short: 2 byte, 0..65535."],["Versi slide dosen · int","int: 4 byte, −2147483648..2147483647. unsigned int: 4 byte, 0..4294967295. Contoh pembanding slide memakai int 2 byte pada Turbo C 2.0."],["Versi slide dosen · long dan long long","long: 4 byte, rentang seperti int pada tabel. long long: 8 byte, −9223372036854775808..9223372036854775807. Ukuran nyata mengikuti implementasi."],["Versi slide dosen · float dan double","float 4 byte dan double 8 byte. Keduanya dapat mewakili nilai negatif, nol, dan positif. Besaran maksimum positif tipikal sekitar 3.4×10³⁸ dan 1.7×10³⁰⁸."],["Signed 8 bit pada tabel","Dalam two's complement, bit teratas berbobot −128. Maka 10000000₂ mewakili −128 dan 11111111₂ mewakili −1."],["Literal dan suffix","'H' adalah literal karakter dan \"H\" literal string. 1 dan '1' berbeda. 174u, 174L, 174ul masing-masing bertipe unsigned int, long, unsigned long."],["Constant","#define Pi 3.14 mengganti token Pi dengan literal. const float pi = 3.14f; membuat objek dengan alamat yang bisa diambil, tetapi nilainya tidak boleh diubah."],["Format printf","%d atau %i untuk int, %u unsigned, %o oktal, %x heksadesimal, %f desimal pecahan, %e eksponen. %c karakter, %s string."],["Lebar dan presisi","%5.2f menampilkan dua angka setelah titik dengan lebar minimum lima. Width tidak memotong output yang lebih panjang."],["Format scanf","%d dengan int*, %f dengan float*, %lf dengan double*. Contoh float r; scanf(\"%f\", &r);."]],"traps":["Menyimpan 7 / 2 ke variabel float tetap menghasilkan 3.0. Gunakan operand floating agar pembagian menghasilkan 3.5.","Versi slide dosen: literal atau macro untuk literal tidak memiliki alamat objek. const float pi adalah objek dan &pi sah.","sizeof(char) selalu 1 byte. Besar byte dalam bit dan ukuran tipe lain mengikuti implementasi."],"cards":[["Deklarasi","int score = 75; menyimpan 75 di objek score. &score adalah alamatnya. Ekspresi score dapat menunjuk objek dan nilainya dapat dibaca."],["Versi slide dosen · char dan unsigned char","Dengan byte 8 bit dan char bertanda: 1 byte, −128..127. unsigned char: 1 byte, 0..255. Signedness plain char bergantung implementasi."],["Versi slide dosen · short","short: 2 byte, −32768..32767. unsigned short: 2 byte, 0..65535."],["Versi slide dosen · int","int: 4 byte, −2147483648..2147483647. unsigned int: 4 byte, 0..4294967295. Contoh pembanding slide memakai int 2 byte pada Turbo C 2.0."],["Versi slide dosen · long dan long long","long: 4 byte, rentang seperti int pada tabel. long long: 8 byte, −9223372036854775808..9223372036854775807. Ukuran nyata mengikuti implementasi."],["Versi slide dosen · float dan double","float 4 byte dan double 8 byte. Keduanya dapat mewakili nilai negatif, nol, dan positif. Besaran maksimum positif tipikal sekitar 3.4×10³⁸ dan 1.7×10³⁰⁸."],["Signed 8 bit pada tabel","Dalam two's complement, bit teratas berbobot −128. Maka 10000000₂ mewakili −128 dan 11111111₂ mewakili −1."],["Literal dan suffix","'H' adalah literal karakter dan \"H\" literal string. 1 dan '1' berbeda. 174u, 174L, 174ul masing-masing bertipe unsigned int, long, unsigned long."],["Constant","#define Pi 3.14 mengganti token Pi dengan literal. const float pi = 3.14f; membuat objek dengan alamat yang bisa diambil, tetapi nilainya tidak boleh diubah."],["Format printf","%d atau %i untuk int, %u unsigned, %o oktal, %x heksadesimal, %f desimal pecahan, %e eksponen. %c karakter, %s string."],["Lebar dan presisi","%5.2f menampilkan dua angka setelah titik dengan lebar minimum lima. Width tidak memotong output yang lebih panjang."],["Format scanf","%d dengan int*, %f dengan float*, %lf dengan double*. Contoh float r; scanf(\"%f\", &r);."],["%d","printf: int dalam desimal. scanf: alamat int."],["%o","printf: unsigned int dalam oktal."],["%u","printf: unsigned int dalam desimal."],["%x","printf: unsigned int dalam heksadesimal dengan a–f."],["%f","printf: bilangan floating dalam bentuk desimal. scanf: alamat float."],["%e","printf: floating dalam bentuk eksponen."],["%lf","scanf: alamat double."],["%c","printf: tampilkan satu karakter."],["%s","printf: tampilkan string sampai null. scanf: baca satu token sampai whitespace (batasi lebar)."]],"quiz":[{"q":"Manakah literal bertipe float?","answer":"3.14f","level":"Mudah","type":"Pilihan ganda","why":"Suffix f memilih float. Tanpa suffix tipenya double, sedangkan L memilih long double.","options":["3.14f","3.14","3.14L"]},{"q":"Bagaimana memperoleh alamat variabel r?","answer":"&r","level":"Mudah","type":"Pilihan ganda","why":"&r menghasilkan alamat. r membaca nilai dan sizeof(r) menghasilkan ukuran dalam byte.","options":["r","&r","sizeof(r)"]},{"q":"Apa yang tercetak?","answer":"3.0","level":"Sedang","type":"Tebak output","why":"7 / 2 memakai dua int sehingga hasilnya 3. Assignment mengubahnya ke 3.0 dan %.1f mencetak satu angka pecahan. Tidak ada pembulatan menjadi 4.","options":["3.5","4.0","3.0"],"code":"#include <stdio.h>\n\nint main(void) {\n    float y = 7 / 2;\n    printf(\"%.1f\", y);\n    return 0;\n}","steps":"7 / 2 memakai dua int sehingga hasilnya 3. Assignment mengubahnya ke 3.0 dan %.1f mencetak satu angka pecahan. Tidak ada pembulatan menjadi 4."},{"q":"Berapa x setelah cast ini?","answer":"-3","level":"Sedang","type":"Tebak nilai variabel","why":"Konversi ke int membuang pecahan menuju nol. Tanda negatif tetap ada.","options":["-3","-4","3"],"code":"#include <stdio.h>\n\nint main(void) {\n    float f = -3.9f;\n    int x = (int)f;\n    return 0;\n}","steps":"Konversi ke int membuang pecahan menuju nol. Tanda negatif tetap ada."},{"q":"Specifier yang membaca input ke double d adalah ...","answer":"%lf","level":"Mudah","type":"Pilihan ganda","why":"Untuk scanf dengan &d, %lf membutuhkan double*. %f membutuhkan float* dan %d membutuhkan int*.","options":["%f","%lf","%d"]},{"q":"Berapa output di antara dua tanda |? Sertakan kedua pembatas saat memilih.","answer":"| 3.50|","level":"Sedang","type":"Tebak output","why":"3.50 berisi empat karakter. Width 5 menambah satu spasi kiri. Presisi 2 menulis dua angka sesudah titik.","options":["|3.50|","| 3.5|","| 3.50|"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"|%5.2f|\", 3.5);\n    return 0;\n}","steps":"3.50 berisi empat karakter. Width 5 menambah satu spasi kiri. Presisi 2 menulis dua angka sesudah titik."},{"q":"Dalam tabel slide dengan unsigned char 8 bit, berapa nilai maksimumnya?","answer":"255","level":"Sedang","type":"Isian singkat","why":"8 bit memberi 256 pola. Dimulai dari 0, nilai terakhir adalah 255.","steps":"8 bit memberi 256 pola. Dimulai dari 0, nilai terakhir adalah 255."},{"q":"Pada model two's complement 8 bit, berapa nilai signed 11111111?","answer":"-1","level":"Sulit","type":"Isian singkat","why":"Bit atas bernilai −128. Tujuh bit lain menjumlah 127, sehingga hasilnya −1.","steps":"Bit atas bernilai −128. Tujuh bit lain menjumlah 127, sehingga hasilnya −1."},{"q":"sizeof(int) wajib bernilai 4 pada semua compiler.","answer":"Salah","level":"Mudah","type":"Benar/salah","why":"Ukuran int merupakan pilihan implementasi dalam batas standar. Slide membandingkan int 4 byte dan 2 byte.","options":["Benar","Salah"]},{"q":"Jenis literal \"H\" adalah ...","answer":"String","level":"Sedang","type":"Pilihan ganda","why":"Petik ganda membentuk string yang diakhiri null. Literal karakter menggunakan petik tunggal dan integer 1 ditulis tanpa petik.","options":["String","Karakter tunggal dalam petik tunggal","Integer 1"]},{"q":"Untuk float r, pilihan mana yang benar untuk membaca r?","answer":"scanf(\"%f\", &r);","level":"Sedang","type":"Perbaiki error","why":"%f memerlukan float*. %d meminta int*. Bentuk tanpa & mengirim nilai, bukan lokasi tujuan.","options":["scanf(\"%d\", &r);","scanf(\"%f\", &r);","scanf(\"%f\", r);"]},{"q":"Alamat objek const float pi = 3.14f; boleh diambil dengan &pi.","answer":"Benar","level":"Sulit","type":"Benar/salah","why":"const membatasi modifikasi, tetapi pi tetap objek. Macro yang diganti menjadi literal 3.14 berbeda dari objek const ini.","options":["Benar","Salah"]},{"q":"Apa outputnya?","answer":"1a","level":"Sedang","type":"Tebak output","why":"%x menulis basis 16. 26 = 1 × 16 + 10 sehingga digitnya 1a. 26 adalah desimal dan 32 adalah oktal.","options":["1a","26","32"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"%x\", 26u);\n    return 0;\n}","steps":"%x menulis basis 16. 26 = 1 × 16 + 10 sehingga digitnya 1a. 26 adalah desimal dan 32 adalah oktal."}]},"4":{"core":["Operator mengolah satu atau beberapa operand. ++x bersifat unary, x + y binary, dan kondisi ? a : b ternary.","Assignment menyimpan nilai ke objek di kiri. Pada x = y = 3, y mendapat 3, lalu x mendapat 3.","Pembagian dua integer membuang pecahan. Operator % memberikan sisa pembagian integer.","Pada z = ++x, z menerima nilai baru. Pada z = x++, z menerima nilai lama. Setelah statement selesai, x sudah bertambah pada kedua bentuk.","Operator relational dan logical menghasilkan 0 atau 1. Dalam kondisi, nilai bukan nol berarti benar.","Operator bitwise mengolah posisi bit. Pada AND, bit hasil 1 hanya jika kedua bit 1. Pada XOR, bit hasil 1 jika kedua bit berbeda.","Gunakan tanda kurung saat membaca ekspresi gabungan. x *= y + 1 mengalikan x dengan seluruh nilai y + 1."],"sheet":[["Assignment","a = b menyimpan nilai b di a. a += b setara dengan a = a + b untuk variabel biasa."],["Arithmetic","+ dan - menjumlahkan dan mengurangi. * dan / mengalikan dan membagi. % mencari sisa. ++ dan -- mengubah nilai sebesar satu."],["Relational","== != < > <= >= membandingkan dua nilai dan menghasilkan 1 jika benar, 0 jika salah."],["Logical","Untuk pasangan (p,q) = 00, 01, 10, 11, hasil && berturut-turut 0,0,0,1 dan hasil || adalah 0,1,1,1. !0 bernilai 1 dan !5 bernilai 0."],["Bitwise","& memilih bit yang sama-sama 1. | memilih bit yang minimal satu bernilai 1. ^ memilih bit yang berbeda. ~ membalik bit."],["Shift","Untuk 78, 78 >> 3 menghasilkan 9 dan 78 << 2 menghasilkan 312. Jangan batasi hasil shift kiri ke 8 bit kecuali soal memintanya."],["Pointer","&x mengambil alamat x. *p membaca atau menulis objek yang ditunjuk p."],["Ternary","max = (a > b) ? a : b memilih a jika perbandingan benar, b jika salah."],["Ringkasan precedence, tinggi ke rendah","Postfix ++ -- → unary → * / % → + - → << >> → < <= > >= → == != → & → ^ → | → && → || → ?: → assignment."],["Associativity","Operator binary pada ringkasan selain assignment dan ?: dikelompokkan dari kiri. Unary prefix, ?: dan assignment dari kanan. Associativity menentukan pengelompokan, bukan urutan evaluasi operand."]],"traps":["& dan && bisa memberikan nilai berbeda untuk operand yang sama. 2 & 1 bernilai 0, sedangkan 2 && 1 bernilai 1.","Versi slide dosen: ~0xC3 menjadi 0x3C bila hanya 8 bit terendah yang ditampilkan. Untuk menyatakan batas itu dalam C gunakan (~0xC3u) & 0xFFu.","Untuk seluruh integer, uji ganjil dengan n % 2 != 0. Sisa bilangan ganjil negatif bisa -1.","Sisi kiri assignment harus bisa ditulis. Literal 7 tidak bisa menerima assignment."],"cards":[["Assignment","a = b menyimpan nilai b di a. a += b setara dengan a = a + b untuk variabel biasa."],["Arithmetic","+ dan - menjumlahkan dan mengurangi. * dan / mengalikan dan membagi. % mencari sisa. ++ dan -- mengubah nilai sebesar satu."],["Relational","== != < > <= >= membandingkan dua nilai dan menghasilkan 1 jika benar, 0 jika salah."],["Logical","Untuk pasangan (p,q) = 00, 01, 10, 11, hasil && berturut-turut 0,0,0,1 dan hasil || adalah 0,1,1,1. !0 bernilai 1 dan !5 bernilai 0."],["Bitwise","& memilih bit yang sama-sama 1. | memilih bit yang minimal satu bernilai 1. ^ memilih bit yang berbeda. ~ membalik bit."],["Shift","Untuk 78, 78 >> 3 menghasilkan 9 dan 78 << 2 menghasilkan 312. Jangan batasi hasil shift kiri ke 8 bit kecuali soal memintanya."],["Pointer","&x mengambil alamat x. *p membaca atau menulis objek yang ditunjuk p."],["Ternary","max = (a > b) ? a : b memilih a jika perbandingan benar, b jika salah."],["Ringkasan precedence, tinggi ke rendah","Postfix ++ -- → unary → * / % → + - → << >> → < <= > >= → == != → & → ^ → | → && → || → ?: → assignment."],["Associativity","Operator binary pada ringkasan selain assignment dan ?: dikelompokkan dari kiri. Unary prefix, ?: dan assignment dari kanan. Associativity menentukan pengelompokan, bukan urutan evaluasi operand."]],"quiz":[{"q":"Berapa operand milik operator ?: ?","answer":"3","level":"Mudah","type":"Pilihan ganda","why":"Kondisi, nilai jika benar, dan nilai jika salah adalah tiga operand. Unary memakai satu dan binary memakai dua.","options":["1","3","2"]},{"q":"Berapa nilai z setelah statement terakhir?","answer":"44","level":"Mudah","type":"Tebak nilai variabel","why":"y mula-mula 44. Post-increment memberikan 44 ke z, kemudian y menjadi 45. Operasi ini tidak mengurangi y.","options":["45","43","44"],"code":"#include <stdio.h>\n\nint main(void) {\n    int y = 44;\n    int z = y++;\n    return 0;\n}","steps":"y mula-mula 44. Post-increment memberikan 44 ke z, kemudian y menjadi 45. Operasi ini tidak mengurangi y."},{"q":"Berapa nilai z?","answer":"45","level":"Mudah","type":"Tebak nilai variabel","why":"x mulai dari 44, ++x menambah satu menjadi 45, lalu z menerima 45. Tidak ada penambahan kedua.","options":["45","44","46"],"code":"#include <stdio.h>\n\nint main(void) {\n    int x = 44;\n    int z = ++x;\n    return 0;\n}","steps":"x mulai dari 44, ++x menambah satu menjadi 45, lalu z menerima 45. Tidak ada penambahan kedua."},{"q":"Apa yang dicetak?","answer":"12","level":"Sedang","type":"Tebak output","why":"y + 1 = 4. Kemudian x = 3 × 4 = 12. Nilai 10 berasal dari 3 × 3 + 1, sedangkan 8 bukan hasil perkalian ini.","options":["10","12","8"],"code":"#include <stdio.h>\n\nint main(void) {\n    int x = 3, y = 3;\n    x *= y + 1;\n    printf(\"%d\", x);\n    return 0;\n}","steps":"y + 1 = 4. Kemudian x = 3 × 4 = 12. Nilai 10 berasal dari 3 × 3 + 1, sedangkan 8 bukan hasil perkalian ini."},{"q":"Hitung 17 % 5.","answer":"2","level":"Sedang","type":"Isian singkat","why":"17 = 3 × 5 + 2. Operator % mengambil sisa 2, bukan hasil bagi 3.","steps":"17 = 3 × 5 + 2. Operator % mengambil sisa 2, bukan hasil bagi 3."},{"q":"Apa yang dicetak?","answer":"0 1","level":"Sedang","type":"Tebak output","why":"2 = 10₂ dan 1 = 01₂. AND bitwise tidak menemukan posisi 1 yang sama. AND logical bernilai 1 karena keduanya bukan nol.","options":["0 1","1 1","0 0"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"%d %d\", 2 & 1, 2 && 1);\n    return 0;\n}","steps":"2 = 10₂ dan 1 = 01₂. AND bitwise tidak menemukan posisi 1 yang sama. AND logical bernilai 1 karena keduanya bukan nol."},{"q":"Berapa hasil 24 | 35?","answer":"59","level":"Sedang","type":"Tebak nilai variabel","why":"011000 OR 100011 menjadi 111011, yaitu 32 + 16 + 8 + 2 + 1 = 59. AND menghasilkan 0. Logical OR menghasilkan 1.","options":["0","59","1"],"steps":"011000 OR 100011 menjadi 111011, yaitu 32 + 16 + 8 + 2 + 1 = 59. AND menghasilkan 0. Logical OR menghasilkan 1."},{"q":"Hitung 45 ^ 75 dalam desimal.","answer":"102","level":"Sulit","type":"Isian singkat","why":"0101101 XOR 1001011 menjadi 1100110. Jumlah bobot bitnya 64 + 32 + 4 + 2 = 102.","steps":"0101101 XOR 1001011 menjadi 1100110. Jumlah bobot bitnya 64 + 32 + 4 + 2 = 102."},{"q":"Apa nilai 78 >> 3?","answer":"9","level":"Sedang","type":"Tebak nilai variabel","why":"Geser kanan tiga kali: 78 → 39 → 19 → 9. Nilai 39 baru satu pergeseran, sedangkan 312 berasal dari shift kiri dua kali.","options":["9","39","312"],"steps":"Geser kanan tiga kali: 78 → 39 → 19 → 9. Nilai 39 baru satu pergeseran, sedangkan 312 berasal dari shift kiri dua kali."},{"q":"Berapa hasil 78 << 2 sebagai int?","answer":"312","level":"Sulit","type":"Tebak nilai variabel","why":"78 → 156 → 312. Nilai 156 baru satu shift. Nilai 56 hanya delapan bit bawah dari 312.","options":["56","312","156"],"steps":"78 → 156 → 312. Nilai 156 baru satu shift. Nilai 56 hanya delapan bit bawah dari 312."},{"q":"Apa output heksadesimalnya?","answer":"3C","level":"Sulit","type":"Tebak output","why":"C3 = 11000011. Setelah dibalik, delapan bit terbawah adalah 00111100 = 3C. Mask memilih delapan bit itu. C3 belum dibalik dan 3D memiliki bit terakhir 1.","options":["C3","3D","3C"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"%X\", (~0xC3u) & 0xFFu);\n    return 0;\n}","steps":"C3 = 11000011. Setelah dibalik, delapan bit terbawah adalah 00111100 = 3C. Mask memilih delapan bit itu. C3 belum dibalik dan 3D memiliki bit terakhir 1."},{"q":"Hasil perbandingan 20 > 10 dalam C adalah 20.","answer":"Salah","level":"Mudah","type":"Benar/salah","why":"Karena 20 lebih besar dari 10, nilai ekspresi perbandingannya 1. Operand 20 sendiri tidak menjadi hasil.","options":["Benar","Salah"]},{"q":"Manakah bentuk yang keliru untuk mengisi x bertipe int?","answer":"7 = x;","level":"Sedang","type":"Perbaiki error","why":"Literal 7 tidak bisa diubah. Kedua pilihan lain menulis ke variabel x. Untuk +=, x harus sudah mempunyai nilai.","options":["x = 7;","7 = x;","x += 7;"]},{"q":"Apa yang dicetak?","answer":"1","level":"Sulit","type":"Tebak output","why":"Perkalian memberi 6, penjumlahan memberi 7, lalu perbandingan 7 == 7 menghasilkan 1. Angka 7 adalah nilai antara.","options":["0","7","1"],"code":"#include <stdio.h>\n\nint main(void) {\n    printf(\"%d\", 1 + 2 * 3 == 7);\n    return 0;\n}","steps":"Perkalian memberi 6, penjumlahan memberi 7, lalu perbandingan 7 == 7 menghasilkan 1. Angka 7 adalah nilai antara."}]},"5":{"core":["if mengevaluasi kondisi. Nilai nol melewati statement, nilai bukan nol menjalankannya.","Kurung kurawal mengelompokkan beberapa statement menjadi satu blok. Pada if-else, tepat satu cabang dijalankan.","Dua if terpisah dapat sama-sama berjalan. Pada rantai else if, cabang pertama yang benar menentukan jalur.","Dalam nested if, else melekat ke if terdahulu terdekat yang belum memiliki else dan masih dapat dipasangkan.","switch memilih case berdasarkan nilai integer, termasuk char. Case memakai ekspresi konstan integer.","break mengakhiri switch. Tanpa break, eksekusi dapat berlanjut ke label berikutnya.","Ekspresi kondisi ? a : b memilih dan menghasilkan salah satu nilai."],"sheet":[["if dan else","if (nilai >= 75) { /* lulus */ } else { /* ulang */ }"],["Nested if","Di dalam blok if atau else, kondisi kedua dapat memilih jalur yang lebih spesifik."],["switch dan default","switch (op) { case '+': /* tambah */ break; default: /* operator lain */ break; }"],["Akar persamaan","Untuk a ≠ 0, hitung d = b*b - 4*a*c. Jika d < 0, pilih cabang Imaginary. Untuk d ≥ 0, fungsi sqrt dari math.h dapat dipakai."],["Kalkulator","Gunakan if-else-if untuk membandingkan kondisi atau switch (op) untuk memilih '+', '-', '*', '/'. Sebelum membagi, periksa pembagi."],["Grading kelas dan lab","Class = 0.5 × final + 0.3 × mid + 0.2 × assignment. Lab = 0.4 × final + 0.3 × mid + 0.3 × assignment."],["Nilai akhir","Final = 0.8 × Class + 0.2 × Lab. Contoh program slide memakai ceil sebelum menetapkan grade."],["Grade integer 0–100","A mulai 85, B mulai 75, C mulai 65, D mulai 50. Di bawah 50 mendapat E. Periksa dari ambang tertinggi."],["Operator ?:","max = (a > b) ? a : b;"]],"traps":["Indentasi tidak mengubah pasangan else. Gunakan kurung kurawal untuk menyatakan maksud dengan jelas.","Branch case yang cocok dapat melanjutkan ke case berikutnya jika tidak ada break atau pengalihan alur lain.","Cek batas tepat 85, 75, 65, dan 50. Operator > akan melewatkan nilai batas jika seharusnya memakai >=."],"cards":[["if dan else","if (nilai >= 75) { /* lulus */ } else { /* ulang */ }"],["Nested if","Di dalam blok if atau else, kondisi kedua dapat memilih jalur yang lebih spesifik."],["switch dan default","switch (op) { case '+': /* tambah */ break; default: /* operator lain */ break; }"],["Akar persamaan","Untuk a ≠ 0, hitung d = b*b - 4*a*c. Jika d < 0, pilih cabang Imaginary. Untuk d ≥ 0, fungsi sqrt dari math.h dapat dipakai."],["Kalkulator","Gunakan if-else-if untuk membandingkan kondisi atau switch (op) untuk memilih '+', '-', '*', '/'. Sebelum membagi, periksa pembagi."],["Grading kelas dan lab","Class = 0.5 × final + 0.3 × mid + 0.2 × assignment. Lab = 0.4 × final + 0.3 × mid + 0.3 × assignment."],["Nilai akhir","Final = 0.8 × Class + 0.2 × Lab. Contoh program slide memakai ceil sebelum menetapkan grade."],["Grade integer 0–100","A mulai 85, B mulai 75, C mulai 65, D mulai 50. Di bawah 50 mendapat E. Periksa dari ambang tertinggi."],["Operator ?:","max = (a > b) ? a : b;"]],"quiz":[{"q":"Jika kondisi if bernilai 0, cabang mana berjalan pada if-else?","answer":"else","level":"Mudah","type":"Pilihan ganda","why":"Nol berarti salah sehingga else dipilih. Struktur ini menjalankan hanya satu cabang.","options":["if","Keduanya","else"]},{"q":"Apa yang dimaksud nested if?","answer":"if di dalam cabang if atau else lain","level":"Mudah","type":"Pilihan ganda","why":"Nested menunjukkan posisi dalam cabang lain. Dua if sejajar berbeda, sedangkan loop mengulang.","options":["if di dalam cabang if atau else lain","Dua if berurutan pada tingkat sama","Satu perulangan"]},{"q":"Apa yang tercetak saat degree = 80?","answer":"Tidak ada output","level":"Sedang","type":"Tebak output","why":"80 < 80 salah sehingga seluruh if dalam dilewati. else melekat ke if (degree > 30) dan hanya bisa dijangkau bila if luar benar.","options":["Hot","Tidak ada output","Cool"],"code":"#include <stdio.h>\n\nint main(void) {\n    int degree = 80;\n    if (degree < 80)\n        if (degree > 30) printf(\"Hot\");\n        else printf(\"Cool\");\n    return 0;\n}","steps":"80 < 80 salah sehingga seluruh if dalam dilewati. else melekat ke if (degree > 30) dan hanya bisa dijangkau bila if luar benar."},{"q":"Apa yang tercetak saat degree = 30?","answer":"Cool","level":"Sedang","type":"Tebak output","why":"30 < 80 benar sehingga if dalam diperiksa. 30 > 30 salah sehingga else mencetak Cool.","options":["Hot","Tidak ada output","Cool"],"code":"#include <stdio.h>\n\nint main(void) {\n    int degree = 30;\n    if (degree < 80)\n        if (degree > 30) printf(\"Hot\");\n        else printf(\"Cool\");\n    return 0;\n}","steps":"30 < 80 benar sehingga if dalam diperiksa. 30 > 30 salah sehingga else mencetak Cool."},{"q":"Apa yang dicetak dua if ini?","answer":"B","level":"Sedang","type":"Tebak output","why":"90 memenuhi kedua kondisi. grade berubah dari E ke A lalu ke B sebelum dicetak.","options":["B","A","E"],"code":"#include <stdio.h>\n\nint main(void) {\n    int mark = 90;\n    char grade = 'E';\n    if (mark >= 85) grade = 'A';\n    if (mark >= 75) grade = 'B';\n    printf(\"%c\", grade);\n    return 0;\n}","steps":"90 memenuhi kedua kondisi. grade berubah dari E ke A lalu ke B sebelum dicetak."},{"q":"Apa yang dicetak rantai ini?","answer":"A","level":"Sedang","type":"Tebak output","why":"90 >= 85 benar, maka grade = A. Kondisi else if dilewati dan E ditimpa.","options":["B","A","E"],"code":"#include <stdio.h>\n\nint main(void) {\n    int mark = 90;\n    char grade = 'E';\n    if (mark >= 85) grade = 'A';\n    else if (mark >= 75) grade = 'B';\n    printf(\"%c\", grade);\n    return 0;\n}","steps":"90 >= 85 benar, maka grade = A. Kondisi else if dilewati dan E ditimpa."},{"q":"Apa hasil switch berikut?","answer":"AB","level":"Sedang","type":"Tebak output","why":"case 1 cocok dan mencetak A. Karena belum ada break, case 2 ikut mencetak B baru kemudian berhenti.","options":["A","B","AB"],"code":"#include <stdio.h>\n\nint main(void) {\n    int x = 1;\n    switch (x) {\n    case 1: printf(\"A\");\n    case 2: printf(\"B\"); break;\n    }\n    return 0;\n}","steps":"case 1 cocok dan mencetak A. Karena belum ada break, case 2 ikut mencetak B baru kemudian berhenti."},{"q":"Jika tidak ada case yang cocok, label mana yang dipilih bila tersedia?","answer":"default","level":"Mudah","type":"Pilihan ganda","why":"switch beralih ke default. Posisi case pertama atau terakhir tidak membuatnya menjadi pilihan cadangan.","options":["default","case pertama","case terakhir"]},{"q":"Tipe ekspresi switch mana yang keliru dalam C?","answer":"double","level":"Sedang","type":"Perbaiki error","why":"switch memerlukan tipe integer. char dan int termasuk tipe integer, sedangkan double bertipe floating.","options":["int","double","char"]},{"q":"Apa nilai z setelah ternary ini?","answer":"7","level":"Sedang","type":"Tebak nilai variabel","why":"3 > 7 salah sehingga operand setelah tanda titik dua dipilih, yaitu 7. Nilai z bukan hasil perbandingannya.","options":["3","1","7"],"code":"#include <stdio.h>\n\nint main(void) {\n    int a = 3, b = 7;\n    int z = (a > b) ? a : b;\n    return 0;\n}","steps":"3 > 7 salah sehingga operand setelah tanda titik dua dipilih, yaitu 7. Nilai z bukan hasil perbandingannya."},{"q":"Nilai Class 80 dan Lab 90. Berapa Final sebelum pembulatan?","answer":"82","level":"Sulit","type":"Isian singkat","why":"0.8 × 80 = 64 dan 0.2 × 90 = 18. Jumlahnya 82.","steps":"0.8 × 80 = 64 dan 0.2 × 90 = 18. Jumlahnya 82."},{"q":"Grade untuk nilai akhir integer tepat 75 adalah ...","answer":"B","level":"Sedang","type":"Pilihan ganda","why":"75 memenuhi ambang B, belum mencapai A (85), dan berada di atas batas atas C (74).","options":["C","B","A"]},{"q":"Nilai final, mid, assignment kelas masing-masing 90, 80, 70. Hitung Class.","answer":"83","level":"Sulit","type":"Isian singkat","why":"0.5 × 90 = 45, 0.3 × 80 = 24, dan 0.2 × 70 = 14. Total kelas 83.","steps":"0.5 × 90 = 45, 0.3 × 80 = 24, dan 0.2 × 70 = 14. Total kelas 83."}]},"6":{"core":["Pada for, inisialisasi berjalan sekali. Sebelum setiap iterasi, kondisi diuji. Setelah isi berjalan, ekspresi update dijalankan.","while memeriksa kondisi di awal, sehingga isi bisa berjalan nol kali.","do-while memeriksa kondisi sesudah isi, sehingga isi berjalan minimal satu kali. Bentuknya diakhiri titik koma.","Loop bisa berakhir saat kondisi salah, sentinel terbaca, pengguna memilih berhenti, atau break dijalankan.","continue melewati sisa iterasi saat ini. Pada for, eksekusi menuju bagian update, kemudian kembali menguji kondisi.","Pada nested loop, loop dalam dijalankan untuk setiap putaran loop luar. Buat satu baris trace per pasangan indeks."],"sheet":[["for","for (int x = 1; x <= 10; x++) { printf(\"%d \", x); }"],["while","int x = 1; while (x <= 10) { printf(\"%d \", x); x++; }"],["do-while","int x = 1; do { printf(\"%d \", x); x++; } while (x <= 10);"],["for tanpa kondisi","for (;;) menghilangkan ketiga ekspresi. Kondisi yang kosong dianggap benar. Gunakan jalan keluar jika loop harus berhenti."],["Dua indeks","Pada for, inisialisasi dan update dapat memakai koma. Misalnya i++, j-- untuk memajukan satu indeks dan memundurkan yang lain."],["Sentinel","Jika 0 menandai akhir data, periksa 0 sebelum menambahkan nilai ke total atau menaikkan penghitung."],["Nested loop","Untuk x = 1..5 dan y = 5..1, pasangan dimulai (1,5), (1,4), ... (1,1), lalu (2,5). Pasangan terakhir (5,1)."],["break dan continue","break keluar dari loop atau switch terdekat. continue melanjutkan iterasi loop terdekat."]],"traps":["Pada while, letakkan perubahan variabel sehingga jalur continue tetap bisa mencapai kondisi berhenti.","Titik koma pada do-while adalah bagian sintaks. Titik koma tepat setelah kepala for atau while justru dapat membentuk isi kosong.","Jika x = 5, break sebelum printf menghentikan seluruh loop. continue sebelum printf hanya melewatkan cetakan 5."],"cards":[["for","for (int x = 1; x <= 10; x++) { printf(\"%d \", x); }"],["while","int x = 1; while (x <= 10) { printf(\"%d \", x); x++; }"],["do-while","int x = 1; do { printf(\"%d \", x); x++; } while (x <= 10);"],["for tanpa kondisi","for (;;) menghilangkan ketiga ekspresi. Kondisi yang kosong dianggap benar. Gunakan jalan keluar jika loop harus berhenti."],["Dua indeks","Pada for, inisialisasi dan update dapat memakai koma. Misalnya i++, j-- untuk memajukan satu indeks dan memundurkan yang lain."],["Sentinel","Jika 0 menandai akhir data, periksa 0 sebelum menambahkan nilai ke total atau menaikkan penghitung."],["Nested loop","Untuk x = 1..5 dan y = 5..1, pasangan dimulai (1,5), (1,4), ... (1,1), lalu (2,5). Pasangan terakhir (5,1)."],["break dan continue","break keluar dari loop atau switch terdekat. continue melanjutkan iterasi loop terdekat."]],"quiz":[{"q":"Loop mana yang menjamin isi berjalan sekali saat kondisi awal salah?","answer":"do-while","level":"Mudah","type":"Pilihan ganda","why":"do-while menguji setelah isi. while dan for menguji kondisi sebelum isi.","options":["do-while","while","for dengan kondisi awal salah"]},{"q":"Bagian pertama for (init; test; update) berjalan berapa kali saat memasuki loop sekali?","answer":"Satu kali","level":"Mudah","type":"Pilihan ganda","why":"Inisialisasi mendahului pengujian pertama. Yang berulang adalah kondisi, isi, dan update jika loop terus berjalan.","options":["Setiap iterasi","Satu kali","Sesudah kondisi salah"]},{"q":"Berapa iterasi for (x = 1; x <= 10; x++)?","answer":"10","level":"Sedang","type":"Isian singkat","why":"Tubuh berjalan untuk x = 1 sampai 10 inklusif. Setelah update ke 11, pengujian gagal.","steps":"Tubuh berjalan untuk x = 1 sampai 10 inklusif. Setelah update ke 11, pengujian gagal."},{"q":"Apa output saat syarat while salah sejak awal?","answer":"X","level":"Sedang","type":"Tebak output","why":"5 < 3 salah sehingga loop dilewati. printf setelah loop mencetak X satu kali.","options":["X","5X","X5"],"code":"#include <stdio.h>\n\nint main(void) {\n    int x = 5;\n    while (x < 3) { printf(\"%d\", x); x++; }\n    printf(\"X\");\n    return 0;\n}","steps":"5 < 3 salah sehingga loop dilewati. printf setelah loop mencetak X satu kali."},{"q":"Apa output do-while berikut?","answer":"5","level":"Sedang","type":"Tebak output","why":"Isi pertama mencetak 5 dan x menjadi 6. Kondisi 6 < 3 salah, jadi 6 tidak dicetak.","options":["Tidak ada output","5","56"],"code":"#include <stdio.h>\n\nint main(void) {\n    int x = 5;\n    do { printf(\"%d\", x); x++; } while (x < 3);\n    return 0;\n}","steps":"Isi pertama mencetak 5 dan x menjadi 6. Kondisi 6 < 3 salah, jadi 6 tidak dicetak."},{"q":"Deretan angka apa yang tercetak?","answer":"1234","level":"Sedang","type":"Tebak output","why":"Saat x = 1..4, angka dicetak. Pada x = 5 break terjadi sebelum printf, jadi 5 dan 6 tidak dicetak.","options":["123456","12346","1234"],"code":"#include <stdio.h>\n\nint main(void) {\n    for (int x = 1; x <= 6; x++) {\n        if (x == 5) break;\n        printf(\"%d\", x);\n    }\n    return 0;\n}","steps":"Saat x = 1..4, angka dicetak. Pada x = 5 break terjadi sebelum printf, jadi 5 dan 6 tidak dicetak."},{"q":"Deretan angka apa yang tercetak dengan continue?","answer":"12346","level":"Sedang","type":"Tebak output","why":"1 hingga 4 dicetak. Iterasi 5 melewati printf. Update menaikkan x ke 6 dan 6 dicetak, lalu kondisi gagal pada 7.","options":["12346","1234","123456"],"code":"#include <stdio.h>\n\nint main(void) {\n    for (int x = 1; x <= 6; x++) {\n        if (x == 5) continue;\n        printf(\"%d\", x);\n    }\n    return 0;\n}","steps":"1 hingga 4 dicetak. Iterasi 5 melewati printf. Update menaikkan x ke 6 dan 6 dicetak, lalu kondisi gagal pada 7."},{"q":"Loop luar berjalan 5 kali, loop dalam selalu 5 kali per putaran luar. Berapa kali isi loop dalam berjalan?","answer":"25","level":"Sulit","type":"Isian singkat","why":"Untuk setiap x ada lima nilai y. Total pasangan adalah 5 + 5 + 5 + 5 + 5 = 25.","steps":"Untuk setiap x ada lima nilai y. Total pasangan adalah 5 + 5 + 5 + 5 + 5 = 25."},{"q":"Sentinel adalah 0. Dari input 3, 4, 0, 8, berapa total sebelum sentinel?","answer":"7","level":"Sedang","type":"Tebak nilai variabel","why":"3 dan 4 masuk total, 0 menghentikan pembacaan, jadi 8 tidak ditambahkan. Angka 2 adalah banyaknya data, bukan total.","options":["15","2","7"],"steps":"3 dan 4 masuk total, 0 menghentikan pembacaan, jadi 8 tidak ditambahkan. Angka 2 adalah banyaknya data, bukan total."},{"q":"for (;;) berhenti sendiri sesudah satu putaran.","answer":"Salah","level":"Mudah","type":"Benar/salah","why":"Kondisi kosong dianggap benar. Tanpa jalan keluar, loop berjalan terus.","options":["Benar","Salah"]},{"q":"Apa output nested loop ini?","answer":"12112221","level":"Sulit","type":"Tebak output","why":"i = 1 berpasangan dengan j = 2 lalu 1, menghasilkan 12 dan 11. i = 2 menghasilkan 22 dan 21. printf tidak menambahkan spasi.","options":["11122122","12112221","1221"],"code":"#include <stdio.h>\n\nint main(void) {\n    for (int i = 1; i <= 2; i++)\n        for (int j = 2; j >= 1; j--)\n            printf(\"%d%d\", i, j);\n    return 0;\n}","steps":"i = 1 berpasangan dengan j = 2 lalu 1, menghasilkan 12 dan 11. i = 2 menghasilkan 22 dan 21. printf tidak menambahkan spasi."},{"q":"Bagian mana melengkapi do { x++; } agar benar?","answer":"while (x < 5);","level":"Sedang","type":"Perbaiki error","why":"do membutuhkan penutup while dengan kondisi dan titik koma. Bentuk tanpa titik koma belum selesai dan for tidak dapat menjadi penutup do.","options":["while (x < 5) tanpa titik koma","for (x < 5);","while (x < 5);"]},{"q":"Berapa nilai akhir count?","answer":"3","level":"Sulit","type":"Tebak nilai variabel","why":"Untuk i = 0, 1, 2, j = 0 menambah count satu lalu j = 1 memicu break. Hanya loop dalam berhenti. Total 1 + 1 + 1 = 3.","options":["3","6","1"],"code":"#include <stdio.h>\n\nint main(void) {\n    int count = 0;\n    for (int i = 0; i < 3; i++) {\n        for (int j = 0; j < 2; j++) {\n            if (j == 1) break;\n            count++;\n        }\n    }\n    return 0;\n}","steps":"Untuk i = 0, 1, 2, j = 0 menambah count satu lalu j = 1 memicu break. Hanya loop dalam berhenti. Total 1 + 1 + 1 = 3."}]},"7":{"core":["Pointer menyimpan alamat. Setelah int *p = &i;, menulis *p berarti menulis i.","Pointer ke pointer menyimpan alamat pointer. Jika int **pp = &p;, maka **pp mencapai objek yang ditunjuk p.","Array menyimpan elemen bertipe sama secara berurutan. Indeks array dengan N elemen adalah 0 sampai N−1.","Jika initializer array hanya mengisi sebagian elemen, elemen sisanya diinisialisasi ke nol. Ukuran dapat disimpulkan bila [] disertai initializer.","Dalam banyak ekspresi, nama array dikonversi ke pointer ke elemen pertama. A[i] dan *(A + i) mengakses elemen yang sama.","Array 2D disimpan per baris. Array 3D menambahkan satu indeks, dan array of pointer menyimpan beberapa alamat.","String C berupa deretan char yang diakhiri null. Kapasitas buffer harus menyediakan tempat untuk terminator."],"sheet":[["Pointer","int i = 0; int *p = &i; *p = 5; mengubah i menjadi 5."],["Pointer ke pointer","int **pp = &p; **pp = 9; mengubah objek yang ditunjuk p menjadi 9."],["Indeks","int A[10]; menyediakan A[0] sampai A[9]. Sisakan indeks 10 di luar akses elemen."],["Initializer","int B[] = {1, 2, -4, 8}; memiliki empat elemen. int C[8] = {1, 2, -4, 8}; memiliki empat nol tambahan."],["Pointer dan nama array","int *p = B; p++; sah jika p tetap di rentang yang diizinkan. B++ dan B = p tidak sah. Nama array bukan variabel pointer yang dapat digeser."],["2D dan 3D","int b[2][2] = {{1}, {3,4}}; menghasilkan baris 1,0 lalu 3,4. int a[2][3][4]; menyimpan 24 int."],["Array of pointer","int *p[4]; menyimpan empat pointer ke int."],["String","\"BINUS\" memakai enam byte termasuk '\\0'. char s[] = {'B','I','N','U','S'}; hanya menyimpan lima karakter tanpa terminator."],["Input kata","char s[40]; scanf(\"%39s\", s); menyimpan maksimal 39 karakter dan terminator. Input berhenti saat whitespace."],["Input baris","Versi slide dosen: gets pernah membaca baris termasuk spasi tetapi tidak membatasi panjang dan sudah dihapus di C11. Pakai fgets(s, sizeof s, stdin); perhatikan newline yang mungkin ikut tersimpan."]],"traps":["Versi slide dosen menyebut nama array “pointer constant”. Dalam C, array dan pointer memiliki tipe berbeda. Pada sizeof A, seluruh array dihitung jika A dideklarasikan sebagai array di scope itu.","Inisialisasi array saat deklarasi berbeda dari assignment setelah deklarasi. Untuk mengubah isi setelahnya, tulis elemen yang diperlukan.","Akses di luar batas memicu undefined behavior. Compiler tidak wajib menolaknya.","char name[40] = \"Amir\"; sah, tetapi name = \"Amir\"; setelah deklarasi tidak sah."],"cards":[["Pointer","int i = 0; int *p = &i; *p = 5; mengubah i menjadi 5."],["Pointer ke pointer","int **pp = &p; **pp = 9; mengubah objek yang ditunjuk p menjadi 9."],["Indeks","int A[10]; menyediakan A[0] sampai A[9]. Sisakan indeks 10 di luar akses elemen."],["Initializer","int B[] = {1, 2, -4, 8}; memiliki empat elemen. int C[8] = {1, 2, -4, 8}; memiliki empat nol tambahan."],["Pointer dan nama array","int *p = B; p++; sah jika p tetap di rentang yang diizinkan. B++ dan B = p tidak sah. Nama array bukan variabel pointer yang dapat digeser."],["2D dan 3D","int b[2][2] = {{1}, {3,4}}; menghasilkan baris 1,0 lalu 3,4. int a[2][3][4]; menyimpan 24 int."],["Array of pointer","int *p[4]; menyimpan empat pointer ke int."],["String","\"BINUS\" memakai enam byte termasuk '\\0'. char s[] = {'B','I','N','U','S'}; hanya menyimpan lima karakter tanpa terminator."],["Input kata","char s[40]; scanf(\"%39s\", s); menyimpan maksimal 39 karakter dan terminator. Input berhenti saat whitespace."],["Input baris","Versi slide dosen: gets pernah membaca baris termasuk spasi tetapi tidak membatasi panjang dan sudah dihapus di C11. Pakai fgets(s, sizeof s, stdin); perhatikan newline yang mungkin ikut tersimpan."]],"quiz":[{"q":"Setelah int *p = &i;, apa yang tersimpan dalam p?","answer":"Alamat i","level":"Mudah","type":"Pilihan ganda","why":"& mengambil alamat. *p membaca nilai objeknya, sedangkan sizeof i menghitung ukuran.","options":["Nilai i","Alamat i","Ukuran i"]},{"q":"Apa yang dicetak?","answer":"5","level":"Sedang","type":"Tebak output","why":"i dimulai dari 0. p menunjuk i. *p = 5 menulis ke i, kemudian printf membaca 5.","options":["0","Alamat p","5"],"code":"#include <stdio.h>\n\nint main(void) {\n    int i = 0, *p = &i;\n    *p = 5;\n    printf(\"%d\", i);\n    return 0;\n}","steps":"i dimulai dari 0. p menunjuk i. *p = 5 menulis ke i, kemudian printf membaca 5."},{"q":"Apa output setelah dua kali dereference?","answer":"9","level":"Sedang","type":"Tebak output","why":"pp menunjuk p, p menunjuk i, maka **pp = 9 menimpa 5. printf membaca nilai i yang sudah berubah.","options":["9","5","0"],"code":"#include <stdio.h>\n\nint main(void) {\n    int i = 5, *p = &i, **pp = &p;\n    **pp = 9;\n    printf(\"%d\", i);\n    return 0;\n}","steps":"pp menunjuk p, p menunjuk i, maka **pp = 9 menimpa 5. printf membaca nilai i yang sudah berubah."},{"q":"Berapa indeks terakhir yang sah untuk int A[10]?","answer":"9","level":"Mudah","type":"Isian singkat","why":"Indeks dimulai dari nol. Sepuluh elemen memiliki indeks 0..9.","steps":"Indeks dimulai dari nol. Sepuluh elemen memiliki indeks 0..9."},{"q":"Berapa nilai B[7]?","answer":"0","level":"Sedang","type":"Tebak nilai variabel","why":"Initializer mengisi indeks 0..3. Empat elemen sisanya otomatis nol. Nilai 8 ada pada B[3].","options":["8","Tidak terinisialisasi","0"],"code":"#include <stdio.h>\n\nint main(void) {\n    int B[8] = {1, 2, -4, 8};\n    return 0;\n}","steps":"Initializer mengisi indeks 0..3. Empat elemen sisanya otomatis nol. Nilai 8 ada pada B[3]."},{"q":"Berapa banyak elemen array int B[] = {1, 2, -4, 8};?","answer":"4","level":"Mudah","type":"Isian singkat","why":"Ukuran tidak ditulis. Empat initializer menghasilkan empat elemen dengan indeks 0..3.","steps":"Ukuran tidak ditulis. Empat initializer menghasilkan empat elemen dengan indeks 0..3."},{"q":"Ekspresi mana mengakses elemen yang sama dengan A[2]?","answer":"*(A + 2)","level":"Sedang","type":"Pilihan ganda","why":"A + 2 menunjuk elemen indeks 2 dan * mengambil nilainya. *A + 2 menjumlahkan 2 ke nilai A[0].","options":["*A + 2","*(A + 2)","A + 2"]},{"q":"Jika B adalah array int dan p = B, operasi mana keliru?","answer":"B++;","level":"Sedang","type":"Perbaiki error","why":"B tidak bisa dimodifikasi sebagai nilai pointer. p adalah variabel pointer sehingga bisa diisi atau dimajukan satu posisi dengan batas yang sesuai.","options":["p++;","p = B;","B++;"]},{"q":"Apa output matriks berikut?","answer":"0 3","level":"Sulit","type":"Tebak output","why":"Baris 0 adalah {1,0} karena initializer parsial. Baris 1 adalah {3,4}. Jadi b[0][1] = 0 dan b[1][0] = 3.","options":["0 3","1 4","3 0"],"code":"#include <stdio.h>\n\nint main(void) {\n    int b[2][2] = {{1}, {3,4}};\n    printf(\"%d %d\", b[0][1], b[1][0]);\n    return 0;\n}","steps":"Baris 0 adalah {1,0} karena initializer parsial. Baris 1 adalah {3,4}. Jadi b[0][1] = 0 dan b[1][0] = 3."},{"q":"Berapa elemen int a[2][3][4]?","answer":"24","level":"Sedang","type":"Isian singkat","why":"Dua kelompok masing-masing mempunyai tiga baris berisi empat int. Totalnya 2 × 3 × 4 = 24.","steps":"Dua kelompok masing-masing mempunyai tiga baris berisi empat int. Totalnya 2 × 3 × 4 = 24."},{"q":"Apa arti int *p[4];?","answer":"Array berisi empat pointer ke int","level":"Sedang","type":"Pilihan ganda","why":"p[4] menetapkan empat elemen. Tanda * pada deklarasi menjadikan setiap elemen pointer ke int.","options":["Pointer ke satu int saja","Array berisi empat int biasa","Array berisi empat pointer ke int"]},{"q":"Berapa sizeof s dalam byte?","answer":"6","level":"Sedang","type":"Tebak nilai variabel","why":"Lima huruf B,I,N,U,S ditambah karakter null. Ukuran array char ini enam byte dan tidak mengikuti ukuran pointer.","options":["6","5","4"],"code":"#include <stdio.h>\n\nint main(void) {\n    char s[] = \"BINUS\";\n    return 0;\n}","steps":"Lima huruf B,I,N,U,S ditambah karakter null. Ukuran array char ini enam byte dan tidak mengikuti ukuran pointer."},{"q":"char s[] = {'B','I','N','U','S'}; aman dipakai sebagai string dengan printf(\"%s\", s).","answer":"Salah","level":"Sulit","type":"Benar/salah","why":"Tidak ada '\\0' pada lima elemen tersebut. %s tanpa batas membutuhkan string yang diterminasi null sehingga pembacaan dapat melewati array.","options":["Benar","Salah"]},{"q":"Apa yang dicetak setelah pointer dimajukan?","answer":"8","level":"Sulit","type":"Tebak output","why":"p mulai di A[0]. Setelah p++ ia menunjuk A[1]. p[1] melangkah satu elemen lagi ke A[2], yaitu 8.","options":["2","4","8"],"code":"#include <stdio.h>\n\nint main(void) {\n    int A[] = {2, 4, 8};\n    int *p = A;\n    p++;\n    printf(\"%d\", p[1]);\n    return 0;\n}","steps":"p mulai di A[0]. Setelah p++ ia menunjuk A[1]. p[1] melangkah satu elemen lagi ke A[2], yaitu 8."}]},"8":{"core":["Pisahkan sentinel dari kode produk biasa sebelum menghitung subtotal.","Pada soal operator, tulis kembali nilai variabel yang berubah akibat assignment.","Kelompokkan bit dari kanan per tiga untuk oktal atau per empat untuk heksadesimal.","Untuk percabangan, telusuri apakah kondisi kedua tetap diperiksa setelah kondisi pertama benar.","Loop dengan pengecekan di akhir pasti menjalankan badan minimal sekali.","Pada latihan string, pastikan apakah yang diperiksa panjang, batas kata, atau pasangan huruf.","Untuk perkalian matriks, ambil satu baris dari A dan satu kolom dari B."],"sheet":[["Sentinel kasir","0000000000 → tampilkan total dan selesai."],["Grade 90","Dua if → B. if / else if → A."],["Panjang string","Valid jika 5 ≤ strlen(s) ≤ 30."],["Bingkai persegi","Tepi jika baris pertama/terakhir atau kolom pertama/terakhir."],["Palindrom","Bandingkan word[left] dan word[right], lalu bergerak ke tengah."],["Matriks","(r × p) · (p × c) menghasilkan (r × c)."]],"traps":["A = B = C juga mengubah B. Periksa apakah soal menganggap baris-baris dijalankan berurutan.","Spasi membuat %s berhenti. Versi slide dosen memakai gets, yang sudah dihapus sejak C11.","Memakai && untuk syarat “terlalu pendek atau terlalu panjang” membuat pengulangan tak pernah berjalan.","Kapitalisasi hanya huruf pertama. Huruf kapital yang sudah ada di tengah kata harus dipertahankan."],"cards":[["Sinyal berhenti kasir","Kode 0000000000 diperiksa sebelum quantity dan price."],["13 & 11","1101₂ & 1011₂ = 1001₂ = 9."],["15870 dalam tiga basis","Biner 11110111111110, oktal 36776, heksadesimal 3DFE."],["Batas panjang 5–30","Ulangi jika len < 5 || len > 30."],["Palindrom","Pasangan ujung selalu cocok saat indeks bergerak ke tengah."],["C[i][j] pada A × B","Jumlahkan A[i][k] × B[k][j] sepanjang dimensi bersama."]],"quiz":[{"q":"Kode produk pertama adalah 0000000000. Apa yang ditampilkan kasir?","options":["Total 0","Harga satu produk","Permintaan quantity","Pesan kode tidak valid"],"answer":"Total 0","why":"total dimulai dari 0. Kode sentinel langsung mengakhiri transaksi sehingga input quantity dan price dilewati. Sentinel memang valid untuk keluar.","level":"Mudah","type":"Pilihan ganda"},{"q":"Pilih identifier yang sah dalam C.","options":["1name","nama barang","jumlah_barang","int"],"answer":"jumlah_barang","why":"Underscore boleh menghubungkan dua kata. 1name diawali digit, spasi memisahkan token, dan int adalah keyword.","level":"Mudah","type":"Pilihan ganda"},{"q":"Input \"Good Morning\" dibaca dengan scanf(\"%19s\", temp) ke array char temp[20]. Apa isi string temp?","options":["Good","Good Morning","Morning","GoodM"],"answer":"Good","why":"Pembacaan %s dimulai dari G dan berhenti di spasi setelah d. Batas 19 membatasi jumlah karakter, bukan memerintahkan scanf membaca sampai 19.","level":"Mudah","type":"Tebak output"},{"q":"Berapa nilai desimal dari 13 & 11?","answer":"9","why":"13 = 1101₂, 11 = 1011₂. Hanya bit yang sama-sama 1 bertahan → 1001₂ = 9.","level":"Sedang","type":"Isian singkat"},{"q":"Dua baris assignment berjalan berurutan. Berapa nilai akhir a?","options":["0","1","11","13"],"answer":"1","why":"Baris pertama mengisi b dan a dengan 11. Pada baris kedua, 11 == 11 benar sehingga a menjadi 1. Nilai 0 berlaku jika b masih 13, dan 11 adalah hasil sementara.","level":"Sulit","type":"Tebak nilai variabel","code":"int b = 13, c = 11, a;\na = b = c;\na = b == c;"},{"q":"Tulis hasil konversi 15870 desimal ke heksadesimal tanpa awalan.","answer":"3DFE","why":"Sisa pembagian berturut-turut dengan 16 adalah E, F, D, 3. Baca dari belakang menjadi 3DFE.","level":"Sedang","type":"Isian singkat"},{"q":"Jika x = 0, berapa hasil ekspresi (x == 1) ? 5 : 7?","options":["7","5","1","0"],"answer":"7","why":"x == 1 salah. Operator memilih operand ketiga, yaitu 7. Nilai 0 adalah hasil kondisi, 5 adalah cabang benar.","level":"Mudah","type":"Tebak nilai variabel"},{"q":"Dua if terpisah memeriksa mark >= 85 lalu mark >= 75. Apa grade akhir jika mark = 90?","options":["A","B","E","Tidak terisi"],"answer":"B","why":"Kondisi pertama benar → grade A, kondisi kedua juga benar → grade B. Nilai A tertimpa. Grade telah terisi dan tidak ada assignment E.","level":"Sedang","type":"Tebak nilai variabel"},{"q":"Berapa kali badan do-while berjalan jika syarat awal salah dan tetap salah?","answer":"1","why":"Badan dijalankan dahulu. Pemeriksaan di akhir segera menghentikan pengulangan, jadi tepat satu kali.","level":"Mudah","type":"Isian singkat"},{"q":"Berapa bintang pada bingkai persegi N = 10?","answer":"36","why":"Dua baris tepi menyumbang 2 × 10 bintang. Delapan baris tengah masing-masing menyumbang 2 → 20 + 16 = 36.","level":"Sedang","type":"Isian singkat"},{"q":"Panjang string harus 5 sampai 30, inklusif. Pilih kondisi pengulangan yang meminta input lagi.","options":["len < 5 || len > 30","len < 5 && len > 30","len <= 5 || len >= 30","len >= 5 && len <= 30"],"answer":"len < 5 || len > 30","why":"Ulangi saat panjang terlalu pendek ATAU terlalu panjang. && pada pilihan kedua mustahil. <= dan >= menolak titik batas, sedangkan pilihan terakhir menyatakan input valid.","level":"Sedang","type":"Pilihan ganda"},{"q":"Hanya kapitalisasi awal setiap kata. Hasil untuk \"good MorNinG\"?","options":["Good MorNinG","Good Morning","GOOD MORNING","good MorNinG"],"answer":"Good MorNinG","why":"g pada awal kata pertama berubah menjadi G. M sudah kapital dan huruf sesudahnya dipertahankan. Mengubah seluruh kata atau menurunkan huruf lain melanggar aturan.","level":"Sedang","type":"Tebak output"},{"q":"Untuk kata \"madam\", pasangan indeks kedua yang dibandingkan adalah ...","options":["0 dan 4","1 dan 3","2 dan 2","0 dan 3"],"answer":"1 dan 3","why":"Pasangan pertama (0,4) cocok → kiri maju dan kanan mundur → (1,3). Indeks 2 merupakan tengah, tidak perlu dibandingkan.","level":"Sedang","type":"Pilihan ganda"},{"q":"Baris A adalah [5,7,8,2] dan kolom B adalah [3,2,1,3]. Berapa hasil dot product?","answer":"43","why":"Kalikan tiap posisi lalu jumlahkan: 15 + 14 + 8 + 6 = 43.","level":"Sulit","type":"Isian singkat"}]},"9":{"core":["Function memecah program menjadi bagian yang dapat diuji dan dikerjakan secara terpisah. Pendekatan top-down merinci masalah utama menjadi submasalah.","High fan-in berarti modul bisa dipanggil oleh banyak bagian. Low fan-out berarti satu modul tidak bergantung pada terlalu banyak modul lain. Self-contained berarti tugasnya jelas dan cukup mandiri.","printf, sqrt, dan strcpy berasal dari library. Function buatan sendiri menetapkan tipe return, nama, parameter, dan isi.","Deklarasikan prototype sebelum pemanggilan jika definisi function berada di bawah main. Tipe return serta tipe, urutan, dan jumlah parameter harus cocok.","Parameter formal adalah nama di definisi function. Argument aktual adalah nilai atau ekspresi pada pemanggilan. Variabel local hanya terlihat dalam scope-nya.","C meneruskan argumen by value. Untuk mengubah variabel pemanggil, kirim salinan alamatnya dan tulis melalui pointer.","Rekursi membutuhkan base case serta langkah yang mendekatinya. Faktorial dan Fibonacci dapat ditulis dengan rekursi atau loop."],"sheet":[["Definisi","int maximum(int a, int b) { return a > b ? a : b; }"],["Prototype","int maximum(int, int); mendeklarasikan tipe sebelum pemanggilan. void tampil(void) tidak mengembalikan nilai dan tidak menerima argumen."],["Scope","Parameter dan variabel di dalam blok memiliki scope terbatas. Variabel di scope file dapat dipakai dari bagian lain sesuai deklarasinya."],["By location pada slide","Kirim &hasil ke parameter int *p. Assignment *p = nilai menulis ke objek pemanggil. Salinan pointernya sendiri tetap diteruskan by value."],["Parameter array 2D","Untuk matriks int dengan 10 kolom, tulis int a[][10]. Ukuran kolom memberi jarak antarbaris. int a[][] tidak cukup untuk parameter ini."],["Faktorial rekursif","Untuk contoh kecil n ≥ 0: long fact(int n) { return n == 0 ? 1L : n * fact(n - 1); }"],["Faktorial iteratif","Untuk contoh kecil n ≥ 0: long fact(int n) { long f = 1; for (int i = 1; i <= n; i++) f *= i; return f; }"],["Fibonacci rekursif","Untuk contoh kecil n ≥ 0: int fib(int n) { return n < 2 ? n : fib(n-1) + fib(n-2); }"],["Fibonacci iteratif","Untuk contoh kecil n ≥ 0: int fib(int n) { if (n < 2) return n; int a = 0, b = 1; for (int i = 2; i <= n; i++) { int t = a + b; a = b; b = t; } return b; }"]],"traps":["Mengubah parameter int x hanya mengubah salinannya. Untuk mengubah variabel asal, berikan alamat lalu dereference.","Array yang dipakai sebagai parameter biasa disesuaikan ke pointer. sizeof parameter tersebut tidak memberikan jumlah elemen array asal.","Base case hanya berguna jika langkah rekursif benar-benar mendekatinya. Batasi domain dan ukuran masukan agar hasil dapat direpresentasikan."],"cards":[["Definisi","int maximum(int a, int b) { return a > b ? a : b; }"],["Prototype","int maximum(int, int); mendeklarasikan tipe sebelum pemanggilan. void tampil(void) tidak mengembalikan nilai dan tidak menerima argumen."],["Scope","Parameter dan variabel di dalam blok memiliki scope terbatas. Variabel di scope file dapat dipakai dari bagian lain sesuai deklarasinya."],["By location pada slide","Kirim &hasil ke parameter int *p. Assignment *p = nilai menulis ke objek pemanggil. Salinan pointernya sendiri tetap diteruskan by value."],["Parameter array 2D","Untuk matriks int dengan 10 kolom, tulis int a[][10]. Ukuran kolom memberi jarak antarbaris. int a[][] tidak cukup untuk parameter ini."],["Faktorial rekursif","Untuk contoh kecil n ≥ 0: long fact(int n) { return n == 0 ? 1L : n * fact(n - 1); }"],["Faktorial iteratif","Untuk contoh kecil n ≥ 0: long fact(int n) { long f = 1; for (int i = 1; i <= n; i++) f *= i; return f; }"],["Fibonacci rekursif","Untuk contoh kecil n ≥ 0: int fib(int n) { return n < 2 ? n : fib(n-1) + fib(n-2); }"],["Fibonacci iteratif","Untuk contoh kecil n ≥ 0: int fib(int n) { if (n < 2) return n; int a = 0, b = 1; for (int i = 2; i <= n; i++) { int t = a + b; a = b; b = t; } return b; }"]],"quiz":[{"q":"Mana function dari standard library?","answer":"sqrt","level":"Mudah","type":"Pilihan ganda","why":"sqrt tersedia di math.h. Dua contoh lain dibuat pengguna dan perlu definisi sendiri.","options":["sqrt","Function maximum buatan mahasiswa","Function hitungNilai buatan mahasiswa"]},{"q":"Apa arti void pada tipe return?","answer":"Tidak mengembalikan nilai","level":"Mudah","type":"Pilihan ganda","why":"void pada posisi return menyatakan tidak ada nilai balik. Daftar parameter ditentukan terpisah dan nol adalah nilai.","options":["Selalu mengembalikan nol","Tidak mengembalikan nilai","Selalu tidak punya parameter"]},{"q":"Jika definisi function berada setelah main dan dipanggil dari main, apa yang perlu muncul dulu?","answer":"Deklarasi prototype yang sesuai","level":"Sedang","type":"Pilihan ganda","why":"Prototype menyediakan deklarasi saat compiler melihat panggilan. Isi main atau variabel global tidak menyatakan tipe function.","options":["Salinan seluruh isi main","Variabel global","Deklarasi prototype yang sesuai"]},{"q":"Mengubah parameter int x biasa selalu mengubah variabel int yang diberikan pemanggil.","answer":"Salah","level":"Sedang","type":"Benar/salah","why":"Nilai x adalah salinan. Untuk mengubah objek pemanggil, function perlu menerima alamat dan menulis melalui pointer.","options":["Salah","Benar"]},{"q":"Function set memiliki parameter int *p dan menjalankan *p = 9. Setelah int x = 2; set(&x); berapa x?","answer":"9","level":"Sedang","type":"Tebak nilai variabel","why":"&x menunjuk x sehingga *p = 9 menulis nilai baru ke x. Alamat dan nilai integer yang disimpan berbeda.","options":["2","9","Alamat p"],"steps":"&x menunjuk x sehingga *p = 9 menulis nilai baru ke x. Alamat dan nilai integer yang disimpan berbeda."},{"q":"Parameter untuk array dua dimensi dengan 10 kolom yang sesuai adalah ...","answer":"int a[][10]","level":"Sedang","type":"Pilihan ganda","why":"Dimensi kolom menentukan ukuran setiap baris. int a[][] kekurangan ukuran itu. int** menunjuk pointer, bukan baris 10 int yang tersusun berurutan.","options":["int a[][]","int **a sebagai pengganti langsung","int a[][10]"]},
